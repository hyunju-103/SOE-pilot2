return for priority and for more reliable State payment; 0 = no behavioural response","used_in":"Shock Scenarios"},{"group":"Tariffs and collections","parameter":"Cost-recovery ratio","value":"as in the data (0); test 85–110%","status":"user","source":"Task team review: average tariff / full cost of supply, the most important single input. Full cost = operating expense (incl. depreciation) + interest","used_in":"Shock Scenarios"},{"group":"Tariffs and collections","parameter":"State share of the tariff gap","value":"100%","status":"user","source":"Share of a change in the tariff gap compensated by the State (SENELEC: RMA compensation), paid in cash at the in-year paid share","used_in":"Shock Scenarios"},{"group":"Tariffs and collections","parameter":"State receivable in current assets","value":"100%","status":"user","source":"Task team review: whether subsidy receivables count as current assets and are collectible can swing X1 more than the waterfall","used_in":"Shock Scenarios"},{"group":"Tariffs and collections","parameter":"Collection rates by segment","value":"households 100%, large private 100%, public 100%; shares 55%/30%/15%","status":"placeholder","source":"Task team review: public administrations usually the weakest payer. Sales shares are placeholders; set from the SOE's billing data","used_in":"Shock Scenarios"},{"group":"Tariffs and collections","parameter":"Demand growth and losses","value":"0% / 0%","status":"user","source":"Macro drivers in the task team review; demand growth scales sales and cash costs together, losses cut customer revenue at the same cost","used_in":"Shock Scenarios"},{"group":"Probability of distress","parameter":"PD method","value":"rating; logistic sensitivity a -2.02276962, b -0.89133626","status":"placeholder","source":"Deterministic default is the rating band PD. Logistic coefficients (Monte Carlo sensitivity) minimize the maximum absolute percentage-point deviation at the 20 reference rating midpoint anchors; illustrative reference PDs, not realized SOE defaults.","used_in":"Shock Scenarios"},{"group":"Probability of distress","parameter":"Monte Carlo expected fiscal cost","value":"Rating-anchored PD (AAA floor, logistic tail below the D threshold) is the core model; single logistic as same-draw sensitivity; no default-event draws","status":"design","source":"Monte Carlo outputs use a monotone curve through the 20 rating band PDs, interpolated in Z-EM between band centres, floored at 0.02% at or above 4.9 and, below Z-EM -1.5 (the D threshold), rising along a logistic tail from 40% with slope b (the logistic slope b), for EFC=PD×EAD×LGD; the single logistic sigmoid(a+b×Z-EM) is a side-by-side same-draw sensitivity; deterministic tabs use the rating band PD; no simulated defaults or realised loss payouts.","used_in":"Shock Scenarios (Monte Carlo)"},{"group":"Fuel policy and cash","parameter":"IPP purchases, share of operating expense","value":"0% (oil preset 17%)","status":"proxy","source":"SENELEC 2022: purchased electricity ≈ COGS 647.4 bn − fuel 494.9 bn = 152.5 bn, / operating expense 888.5 bn; includes OMVS and imports, so an upper bound for IPPs alone. Used only to size tier 1 of the waterfall","used_in":"Shock Scenarios"},{"group":"Fuel policy and cash","parameter":"Reserve account target","value":"0 months of IPP payments and debt service","status":"user","source":"Set from the escrow or debt-service reserve agreement; funded from surpluses after the priority arrears, drawn before priority creditors go unpaid","used_in":"Shock Scenarios"},{"group":"Fuel policy and cash","parameter":"Short-term bank debt refinanced","value":"0%","status":"user","source":"Separate from the waterfall: depends on lenders. Debt base 'Short Term Debt', else near-term maturity share × total liabilities; moved out of current liabilities in the start year (default year 1), or later once the previous year's rating meets the minimum (task team review: a refinancing benefit takes a year or more and depends on rating and investor confidence)","used_in":"Shock Scenarios"},{"group":"Fuel policy and cash","parameter":"Overdraft rate (refinanced)","value":"8.0%","status":"literature","source":"SENELEC note (2026): short-term overdrafts at 7.5–8.5%; mid-point","used_in":"Shock Scenarios"},{"group":"Fuel policy and cash","parameter":"Long-term rate on refinanced debt","value":"5.0%","status":"placeholder","source":"Cost of the structured long-term loans that replace the overdrafts; set from the refinancing term sheet (DFI / concessional terms are lower)","used_in":"Shock Scenarios"},{"group":"Fuel policy and cash","parameter":"Borrowing cap before emergency support","value":"off (0)","status":"user","source":"IMF SOE Stress Test Tool User Guide (2023), Section VIII: cash, then borrowing, then government injection. Set a total-liabilities / total-assets ceiling (e.g. a covenant or the debt limit in the performance contract); the shortfall above it is a capital injection. Under the cash waterfall it applies only to the cash outside it","used_in":"Shock Scenarios"},{"group":"Fuel policy and cash","parameter":"Oil-shock preset: fuel price path","value":"+0%/+60%/+30%/+0%/+0% (years 1–5)","status":"literature","source":"Task team scenario (email of 16 Oct 2026): oil and HFO +60% in 2026; +30% in 2027 is a half-reversion assumption, then back to the base price","used_in":"Shock Scenarios"},{"group":"Fuel policy and cash","parameter":"Oil-shock preset: fuel share of operating expense","value":"55% of OpEx","status":"literature","source":"SENELEC annual report 2022: fuel purchases 494.9 bn / operating expense 888.5 bn = 0.557, rounded down; IPP electricity purchases excluded (0.70 sensitivity)","used_in":"Shock Scenarios"},{"group":"Fuel policy and cash","parameter":"Oil linkage of the fuel bill","value":"1 (oil preset 0.9)","status":"literature","source":"SENELEC annual report 2022: HFO 361.9 bn and coal 35.7 bn within 494.9 bn of fuel purchases; coal does not follow the oil price, so about 0.9 of the bill does. With the fuel share it is the IMF tool's 'share of oil in purchased inputs'","used_in":"Fuel shock"},{"group":"Exposures","parameter":"Revenue volatility fallback","value":"Transport 15%, Energy 10%, Power / Utilities 10%, Agriculture 20%, Industry 12%, Telecoms 8%, Other 15%","status":"placeholder","source":"Used only when an SOE has fewer than three years of revenue","used_in":"Revenue shock"},{"group":"Monte Carlo","parameter":"Fuel / FX standard deviations","value":"10% / 8%","status":"placeholder","source":"Calibrate from historical annual changes for the country","used_in":"Monte Carlo"},{"group":"Monte Carlo","parameter":"Interest-rate / revenue standard deviations","value":"0 bps / 0 s.d. (off)","status":"user","source":"Off by default; set to draw these shocks too","used_in":"Monte Carlo"},{"group":"Monte Carlo","parameter":"Shock correlations","value":"fuel–fx 0.3","status":"placeholder","source":"Fuel–FX 0.30 reflects co-movement for fuel importers; estimate the matrix from country data","used_in":"Monte Carlo"},{"group":"Fiscal context","parameter":"Nominal GDP growth","value":"3%","status":"user","source":"Set by the user","used_in":"EFC / GDP paths"},{"group":"Government support","parameter":"Role and Link scores, tier mapping, uplift table","value":"4 + 4 levels → 7 tiers","status":"proxy","source":"Simplified stand-in for S&P Global Ratings, Rating GREs: Methodology and Assumptions (25 March 2015); S&P matrix not transcribed","used_in":"Government Support"},{"group":"Government support","parameter":"Dynamic cap trigger","value":"rating down 3+ notches or Negative outlook → Moderate","status":"proxy","source":"After S&P GRE criteria (para. 47) — paragraph to verify","used_in":"Government Support"},{"group":"Early warning","parameter":"Trigger rules and actions","value":"10 rules","status":"placeholder","source":"Illustrative rules and pre-agreed actions for discussion with the Ministry of Finance","used_in":"Early Warning, Report"},{"group":"Early warning","parameter":"EFC / GDP bands","value":"watch 0.5%, alert 1.0%","status":"placeholder","source":"Illustrative; relate to the fiscal risk statement's materiality threshold","used_in":"Home, Report"},{"group":"Narrative","parameter":"Single-driver share / strong-component thresholds","value":"60% / X1 0.15, X2 0.05, X3 0.05, X4 0.2","status":"placeholder","source":"Wording thresholds for the automated summaries only","used_in":"Altman Z-EM text"}],"PARAMETER_STATUS_LABELS":{"literature":"Literature / data","user":"User-set in the tool","proxy":"Proxy — working assumption","placeholder":"Placeholder — needs a source","design":"Model design choice — needs justification"},"LINE_SMOOTH_TENSION":0.75,"SHOCK_TYPES":[{"id":"fuel","label":"Fuel price","key":"fuel_shock_pct","what":"Fuel and other energy inputs become more expensive (or cheaper, if negative).","who":"SOEs that burn a lot of fuel: power producers with oil or gas plants, airlines, shipping, bus and rail companies.","direction":"Higher is worse: +25% means the fuel bill is a quarter higher.","path":["The fuel bill rises.","Part of it may be passed on to customers through tariffs, or paid by the State as compensation.","What is left lowers operating profit.","The loss leaves a cash gap, which the SOE fills by borrowing.","Less profit and more debt weaken the health checks, so the distress score falls.","A higher chance of distress on a bigger debt raises the expected fiscal cost."],"results":"Lowers operating profit (health check 3) and, through losses and borrowing, savings (2) and the equity cushion (4).","data":"Fuel cost as a share of operating expense, and the tariff and compensation rules of the regulator.","guide":{"mild":0.1,"standard":0.25,"severe":0.6}},{"id":"fx","label":"Exchange rate (currency fall)","key":"fx_shock_pct","what":"The local currency loses value against the dollar or the euro (or gains, if negative).","who":"SOEs with debt in foreign currency or imported inputs (fuel, equipment) but revenue in local currency.","direction":"Higher is worse: 30% means the local currency loses 30% of its value.","path":["Costs paid in foreign currency rise; revenue earned in foreign currency rises too.","Debt in foreign currency is worth more in local money (revaluation).","Operating profit falls and the revaluation loss cuts equity straight away.","Debt rises relative to assets, so the equity cushion (health check 4) thins.","The distress score falls; the chance of distress and the expected fiscal cost rise."],"results":"Mostly through the equity cushion (health check 4) when much of the debt is in foreign currency; through operating profit (3) when costs are imported.","data":"Share of debt in foreign currency (loan schedule), and shares of costs and revenue in foreign currency.","guide":{"mild":0.1,"standard":0.3,"severe":0.5}},{"id":"rates","label":"Interest rates","key":"rate_shock_bps","what":"Borrowing costs rise: on floating-rate loans at once, and on debt that must be refinanced as it falls due.","who":"SOEs with much floating-rate debt or much debt coming due soon (short-term loans, overdrafts).","direction":"Higher is worse: +200 basis points means +2 percentage points.","path":["Interest on floating-rate debt, and on debt that is rolled over, goes up.","Operating profit does not change, but net income falls.","The loss is borrowed, so debt and interest grow further.","Savings (health check 2) and the equity cushion (4) shrink.","The distress score falls; the chance of distress and the expected fiscal cost rise."],"results":"Works through net income, so it shows in savings (health check 2) and the equity cushion (4), not in operating profit.","data":"Share of debt at floating rates and the amount of debt coming due within a year (loan schedule).","guide":{"mild":100,"standard":200,"severe":400}},{"id":"revenue","label":"Revenue fall (any cause)","key":"revenue_shock_std_devs","what":"Sales fall for any reason: lower demand, a collapse in tourism, a drought, a pandemic. Use it when the shock you have in mind is not in this list.","who":"SOEs whose revenue swings a lot, or that depend on one market (tourism, exports, a commodity).","direction":"A bigger fall is worse. Set it as a % of revenue; the tool also shows it in standard deviations of the SOE's own revenue growth (the DSA convention is −1).","path":["Revenue falls while costs stay where they were.","Operating profit drops by the share of the lost revenue that reaches profit.","The loss leaves a cash gap, filled by borrowing.","All four health checks weaken, so the distress score falls.","The chance of distress and the expected fiscal cost rise."],"results":"Lowers operating profit (health check 3) first, then savings (2), working capital and the equity cushion (1, 4).","data":"Several years of revenue (the tool measures the SOE's own revenue volatility), or your own estimate of the fall.","guide":{"mild":-0.5,"standard":-1.0,"severe":-2.0}},{"id":"arrears","label":"Government arrears","key":"arrears_pct_of_revenue","what":"The government does not pay bills it owes the SOE (for electricity, water or transport services, or compensation), and part of what is owed is written off.","who":"SOEs that sell a lot to ministries, agencies and other SOEs, or that rely on State compensation.","direction":"Higher is worse: the share of a year's revenue written off each shock year. 0 means the government pays on time.","path":["Money the government owes the SOE is written off.","Current assets and equity fall at once (no effect on operating profit).","Working capital (health check 1), savings (2) and the equity cushion (4) weaken.","The distress score falls; the chance of distress and the expected fiscal cost rise.","The write-off cannot exceed the receivables and other non-cash current assets the SOE has."],"results":"Hits working capital (health check 1), savings (2) and the equity cushion (4); operating profit is unchanged.","data":"Receivables from the government and public agencies, and how long they have been overdue.","guide":{"mild":0.02,"standard":0.05,"severe":0.15}}],"SHOCK_SIZE_NOTE":"Sizes are illustrative starting points. 'Standard' is the DSA/DSF stress-test size. Historical reference ranges (median, minimum and maximum change over three to five years) are still to be added. If you have your own data, for example how much fuel prices rose last year, use that number.","TRIGGER_CATEGORIES":["Overall health","Solvency & debt","Liquidity","Stress test","Trend","Fiscal dependency"],"HOW_GLOSSARY":[{"term":"State-owned enterprise (SOE)","def":"A company owned or controlled by the government, such as a power, water, transport, telecoms or farming company."},{"term":"Contingent liability","def":"A cost the government may have to pay only if something goes wrong, such as rescuing a state company."},{"term":"Triage","def":"A quick first sort to decide which cases need attention first. SOE Pilot is a triage tool, not a forecast."},{"term":"Total assets","def":"Everything the company owns: plants, networks, buildings, cash, money owed to it."},{"term":"Current assets","def":"The part of what the company owns that turns into cash within a year: cash, customer bills, stock."},{"term":"Working capital","def":"Current assets minus current liabilities: what is left of the money arriving within a year after paying the bills due within a year."},{"term":"Total liabilities","def":"Everything the company owes: loans, bonds, supplier bills and other debts."},{"term":"Current liabilities","def":"The part of what the company owes that must be paid within a year."},{"term":"Equity","def":"What the company owns minus what it owes: the owners' cushion against losses."},{"term":"Operating profit (EBIT)","def":"Earnings from the company's business before interest and tax are paid."},{"term":"Retained earnings","def":"The running total of all past profits and losses kept in the company. Negative after years of losses."},{"term":"Distress score (Altman Z″-EM)","def":"One number that combines the four health checks with fixed weights. Higher is healthier."},{"term":"Zone","def":"Distress, Grey or Safe: three broad bands of the distress score."},{"term":"Indicative rating","def":"A rating label (AAA to D) read off the distress score. Not an agency rating."},{"term":"Probability of distress (PD)","def":"The chance that, in a given year, the company needs the government to rescue it."},{"term":"Exposure at default (EAD)","def":"How much is at stake if the company needs a rescue. By default, everything it owes."},{"term":"Loss given default (LGD)","def":"The share of the exposure the government ends up paying after recoveries. Default 70%."},{"term":"Expected fiscal cost (EFC)","def":"Exposure × share the government bears × chance of distress. An average over possible futures, not the cost of a failure."},{"term":"Shock","def":"A ‘what if’ applied to a company's accounts, such as a fuel price rise or a currency fall."},{"term":"Cash gap","def":"Money the company needs in a year but doesn't have. By default the tool assumes it borrows to fill it."},{"term":"No-shock path","def":"The company's accounts rolled forward with nothing going wrong. Every shock is compared with it."},{"term":"Monte Carlo simulation","def":"Running the same calculation many times with randomly drawn shock sizes, to see the spread of outcomes."},{"term":"P50 (median)","def":"The middle result: half the simulated outcomes are lower, half are higher."},{"term":"P95 (fiscal-at-risk)","def":"The result that only 1 in 20 simulated outcomes exceeds. Still an expected cost, not the cost of a failure."},{"term":"Smooth PD curve (logistic)","def":"A curve that turns any score into a PD without steps. Used only in Monte Carlo."},{"term":"Notch","def":"One step on the rating ladder, for example from B to B+."},{"term":"Investment grade","def":"The top part of the rating ladder, from BBB− up to AAA."},{"term":"Debt sustainability analysis (DSA)","def":"The IMF and World Bank method for judging whether a country's debt is sustainable. Its standard stress tests set the shock sizes the tool uses."},{"term":"Basis point","def":"One hundredth of a percentage point: 100 basis points = 1 percentage point."},{"term":"Draw","def":"One randomly chosen set of shock sizes in a Monte Carlo simulation: one possible future."},{"term":"Arrears","def":"Payments that are overdue. Government arrears are bills the government owes the company but has not paid."},{"term":"Refinancing","def":"Replacing a loan that comes due with a new loan."},{"term":"EBITDA","def":"Operating profit before depreciation and amortisation: roughly the cash the business generates from its activity."},{"term":"Sovereign rating","def":"The credit rating of the government itself. It caps how far support can lift a company's rating."},{"term":"Nominal GDP","def":"The value of everything a country produces in a year, in current prices. Used to show costs as a share of the economy."}],"ROLE_LINK_TO_TIER":{"2":"Low","3":"Moderate","4":"Moderately High","5":"High","6":"Very High","7":"Extremely High","8":"Almost Certain"},"NUMERIC_COLUMNS":["Year","Revenues","Total Expense","Operating Expense","Operating Profits (EBIT)","Net Income","Current Assets","Total Assets","Current Liabilities","Total Liabilities","Equity","Retained Earnings","Interest Expense","Tax Expense","EBITDA","Government Grants","Depreciation"],"ALL_NUMERIC_COLUMNS":["Year","Revenues","Total Expense","Operating Expense","Operating Profits (EBIT)","Net Income","Current Assets","Total Assets","Current Liabilities","Total Liabilities","Equity","Retained Earnings","Interest Expense","Tax Expense","EBITDA","Government Grants","Depreciation","Cash and Equivalents","Receivables","Inventory","Short Term Debt","Long Term Debt","FX Debt","Government Guaranteed Debt","Operating Revenue","Cost of Goods Sold","Other Operating Expenses","Fuel Cost","Labor Cost","Operating Cash Flow","Capex","Debt Service","Government Subsidies","Capital Injection","On-lending","Government Arrears Owed","VAT Credits","Tariff / PSO Compensation","Operating Subsidy (Flow)","Investment Grant (Flow)","Equity Injection (Flow)","Concessional Loan (Stock)","Guarantee (Contingent)","Tax Support","Fuel Cost Share","FX Cost Share","FX Revenue Share","FX Debt Share","Floating Rate Debt Share"],"TEXT_COLUMNS":["Entity","Sector","Country","Currency","Units","Source File","Source Page","Audit Status","Extraction Method","Data Quality Flag"],"PROVENANCE_COLUMNS":["Source File","Source Page","Audit Status","Extraction Method","Data Quality Flag"],"SCHEMA":{"variables":[{"key":"country","column":"Country","label":"Country","statement":"Identifier","kind":"text","required":false,"used_by":"Grouping, repository","synonyms":["country name","economy","country code","iso3"]},{"key":"soe_name","column":"Entity","label":"SOE name","statement":"Identifier","kind":"text","required":true,"used_by":"Every page","synonyms":["entity","soe","company","enterprise","name","soe name","entity name","company name"]},{"key":"sector","column":"Sector","label":"Sector","statement":"Identifier","kind":"text","required":true,"used_by":"Sector filters, fuel share / LGD / volatility defaults","synonyms":["industry","gics sector","sector name","activity"]},{"key":"fiscal_year","column":"Year","label":"Fiscal year","statement":"Identifier","kind":"year","required":true,"used_by":"Every page","synonyms":["year","fy","financial year","reporting year","period"]},{"key":"currency","column":"Currency","label":"Currency","statement":"Identifier","kind":"text","required":true,"used_by":"Labels","synonyms":["ccy","reporting currency","currency code"]},{"key":"unit","column":"Units","label":"Unit","statement":"Identifier","kind":"text","required":true,"used_by":"Labels, unit scaling","synonyms":["units","scale","unit of measure","denomination"]},{"key":"total_assets","column":"Total Assets","label":"Total assets"," <script>
/*
 * SOE Fiscal Risk Tool — calculation engine, JavaScript port.
 *
 * Mirrors, function for function, the Python modules the Streamlit app uses:
 *   calculations.py  (Z''-EM, KPIs, classify, PD/EFC, revenue volatility, notch change)
 *   shocks.py        (run_scenario, kpi_impact_table, gdp_path, Monte Carlo, percentile path)
 *   narrative.py     (single_soe_narrative, cross_soe_narrative)
 *   utils/summary.py (summarize_z_trend, summarize_zone_distribution)
 *   app_pages/strategic_soe.py (GRE support uplift)
 *   schema.py        (column matching: exact name, synonym, close spelling)
 * Every number it uses (coefficients, cutoffs, rating/PD table, sector tables,
 * shock defaults, GRE tables) comes from config.py via the CFG object that
 * report.py embeds, so recalibrating config.py needs no change here.
 * A change to a FORMULA in the Python modules must be copied here too;
 * tests/check_engine_parity.py compares the two implementations.
 */
(function (root) {
  "use strict";

  function create(CFG) {
    const INF = Infinity;
    const isNum = (v) => typeof v === "number" && Number.isFinite(v);
    const div = (a, b) => (isNum(a) && isNum(b) && b !== 0 ? a / b : NaN); // _safe_div: inf -> NaN
    const lo = (v) => (v === null || v === undefined ? -INF : v);
    /** shocks._fuel_path: the per-year fuel price path (index 0 = projection year 1), or null for the step profile */
    const fuelPath = (p) => { const v = p.fuel_shock_path; return Array.isArray(v) && v.length ? v.map((x) => (isNum(x) ? x : 0)) : null; };
    const hi = (v) => (v === null || v === undefined ? INF : v);
    const ZCOMP = Object.keys(CFG.ZEM_COEFFICIENTS); // X1..X4 in config order
    const ZONES = CFG.ZONES.map(([n, a, b]) => [n, lo(a), hi(b)]);
    const RTABLE = CFG.Z_RATING_TABLE.map(([a, b, r, p]) => [lo(a), hi(b), r, p]);
    const PD_BY_RATING = Object.fromEntries(RTABLE.map((r) => [r[2], r[3]]));
    const K = {
      rev: "Revenues", texp: "Total Expense", opex: "Operating Expense", ebit: "Operating Profits (EBIT)",
      ni: "Net Income", ca: "Current Assets", ta: "Total Assets", cl: "Current Liabilities", tl: "Total Liabilities",
      eq: "Equity", re: "Retained Earnings", int: "Interest Expense", tax: "Tax Expense", ebitda: "EBITDA",
      grants: "Government Grants", dep: "Depreciation",
    };

    /* ---------------- calculations.py ---------------- */
    function classifyZone(z) {
      if (!isNum(z)) return "Unknown";
      for (const [name, a, b] of ZONES) if (a < z && z <= b) return name;
      return "Unknown";
    }
    function zRating(z) {
      if (!isNum(z)) return "—";
      for (const [a, b, r] of RTABLE) if ((a < z && z <= b) || (a === -INF && z <= b)) return r;
      return "—";
    }
    function zemFromValues(wc, ta, re, ebit, eq, tl) {
      const x1 = ta ? wc / ta : NaN, x2 = ta ? re / ta : NaN, x3 = ta ? ebit / ta : NaN, x4 = tl ? eq / tl : NaN;
      const c = CFG.ZEM_COEFFICIENTS;
      const z = c.X1 * x1 + c.X2 * x2 + c.X3 * x3 + c.X4 * x4 + CFG.ZEM_CONSTANT;
      return { X1: x1, X2: x2, X3: x3, X4: x4, Z_EM: z, Zone: classifyZone(z) };
    }
    /** compute_zem_components + compute_kpis on one row (returns a new object). */
    function enrichRow(r) {
      const o = Object.assign({}, r);
      o.X1 = div(r[K.ca] - r[K.cl], r[K.ta]);
      o.X2 = div(r[K.re], r[K.ta]);
      o.X3 = div(r[K.ebit], r[K.ta]);
      o.X4 = div(r[K.eq], r[K.tl]);
      let z = CFG.ZEM_CONSTANT;
      for (const c of ZCOMP) { o[c + "_contrib"] = o[c] * CFG.ZEM_COEFFICIENTS[c]; z += o[c + "_contrib"]; }
      o.Z_EM = z; o.Zone = classifyZone(z); o.Rating = zRating(z);
      const rev = r[K.rev], ebit = r[K.ebit], eq = r[K.eq], ebitda = r[K.ebitda];
      o.operating_margin = div(ebit, rev);
      // Exact cost recovery components only; missing inputs remain n/a, not zero.
      // Grants must already be part of reported revenue for this deduction to apply.
      const cogs = r["Cost of Goods Sold"], otherCosts = r["Other Operating Expenses"], grants = r[K.grants];
      const coveredCost = isNum(cogs) && isNum(otherCosts) ? cogs + otherCosts : NaN;
      o.cost_recovery = isNum(grants) && isNum(coveredCost) && coveredCost > 0 ? div(rev - grants, coveredCost) : NaN;
      o.net_margin = div(r[K.ni], rev);
      o.ebitda_margin = div(ebitda, rev);
      o.roa = div(r[K.ni], r[K.ta]);
      o.roe = eq > 0 ? div(r[K.ni], eq) : NaN;
      o.current_ratio = div(r[K.ca], r[K.cl]);
      o.working_capital_ratio = o.X1;
      o.debt_to_ebitda = ebitda > 0 ? div(r[K.tl], ebitda) : NaN;
      o.liabilities_to_assets = div(r[K.tl], r[K.ta]);
      o.interest_coverage = div(ebit, r[K.int]);
      o.debt_to_equity = eq > 0 ? div(r[K.tl], eq) : NaN;
      o.asset_turnover = div(rev, r[K.ta]);
      o.depreciation_to_ebitda = ebitda > 0 ? div(r[K.dep], ebitda) : NaN;
      o.grants_to_revenue = div(r[K.grants], rev);
      o.grants_to_expense = div(r[K.grants], r[K.texp]);
      o.effective_tax_rate = ebit > 0 ? div(r[K.tax], ebit) : NaN;
      o.negative_equity_flag = eq <= 0;
      o.negative_ebitda_flag = ebitda <= 0;
      return o;
    }
    const enrich = (rows) => rows.map(enrichRow);

    function availableKpis(rows, category) {
      const keys = category ? CFG.KPI_CATEGORIES[category] : Object.keys(CFG.KPI_THRESHOLDS);
      return keys.filter((k) => CFG.KPI_THRESHOLDS[k].requires.every((c) => rows.some((r) => isNum(r[c]))));
    }
    function classify(value, key) {
      if (!isNum(value)) return ["No data", "muted"];
      const s = CFG.KPI_THRESHOLDS[key];
      if (s.direction === "higher_is_better") {
        if (value < s.red_cut) return ["Red", "red"];
        if (value >= s.green_cut) return ["Green", "green"];
        return ["Amber", "amber"];
      }
      if (value > s.red_cut) return ["Red", "red"];
      if (value <= s.green_cut) return ["Green", "green"];
      return ["Amber", "amber"];
    }
    const pdByRating = (rating) => (rating in PD_BY_RATING ? PD_BY_RATING[rating] : NaN);
    function worstPdInZone(zone) {
      const z = ZONES.find((x) => x[0] === zone);
      if (!z) return NaN;
      const cands = RTABLE.filter(([a, b]) => b > z[1] && a < z[2]).map((r) => r[3]);
      return cands.length ? Math.max(...cands) : NaN;
    }
    const pctLabel = (v) => Math.round(v * 100) + "%";
    /** compute_efc for one row. basis "total_liabilities": EAD = share × total liabilities (proxy);
     *  "guaranteed_debt": observed Government Guaranteed Debt where reported, else the proxy. */
    function efcRow(r, lgdPct, eadShare = 1, basis = "total_liabilities") {
      const pd = pdByRating(r.Rating), lgd = lgdPct / 100, g = r["Government Guaranteed Debt"];
      let ead = r[K.tl] * eadShare, src = `Proxy: ${pctLabel(eadShare)} of total liabilities`;
      if (basis === "guaranteed_debt" && isNum(g)) { ead = g; src = "Observed: guaranteed debt"; }
      return { PD: pd, EAD: ead, LGD: lgd, EFC: pd * ead * lgd, EAD_source: src };
    }
    /** soe_exposures: bottom-up shock exposures for one SOE-year → {name: [value, source]} */
    function soeExposures(row) {
      const clip = (v) => Math.max(0, Math.min(1, v));
      const val = (c) => (c && isNum(row[c]) ? row[c] : null);
      const opex = val(K.opex), tl = val(K.tl), sector = row.Sector || "Other", out = {};
      const pick = (name, obs, amt, denom, lab) => {
        const v = obs ? val(obs) : null;
        if (v !== null) { out[name] = [clip(v), `Observed: ${obs}`]; return; }
        const a = amt ? val(amt) : null;
        if (a !== null && denom) { out[name] = [clip(a / denom), `Derived: ${lab}`]; return; }
        if (name === "fuel_cost_share") { out[name] = [CFG.SECTOR_FUEL_COST_SHARE[sector] ?? CFG.SECTOR_FUEL_COST_SHARE.Other, `Sector default (${sector})`]; return; }
        out[name] = [CFG.DEFAULT_EXPOSURES[name], "Default (placeholder)"];
      };
      pick("fuel_cost_share", "Fuel Cost Share", "Fuel Cost", opex, "Fuel Cost / Operating Expense");
      pick("fx_cost_share", "FX Cost Share");
      pick("fx_revenue_share", "FX Revenue Share");
      pick("fx_debt_share", "FX Debt Share", "FX Debt", tl, "FX Debt / Total Liabilities");
      pick("floating_debt_share", "Floating Rate Debt Share");
      pick("near_term_maturity_share", null, "Short Term Debt", tl, "Short Term Debt / Total Liabilities");
      for (const name of ["tariff_passthrough", "revenue_elasticity", "fuel_subsidy_share"]) out[name] = [CFG.DEFAULT_EXPOSURES[name], name === "fuel_subsidy_share" ? "User (off by default)" : "Default (placeholder)"];
      // cash and financing settings of the shock engine (policy, not observed)
      for (const [name, value] of Object.entries(CFG.DEFAULT_CASH_SETTINGS || {})) out[name] = [value, "Policy setting (default: original model, cash drawn first)"];
      return out;
    }
    function recoveryScenarios(sector) {
      const d = CFG.SECTOR_RECOVERY_DATA[sector] || CFG.SECTOR_RECOVERY_DATA.Other;
      const r4 = (v) => Math.round(v * 1e4) / 1e4;
      return [["Low Backstop Intensity", r4(d.p10)], ["25th Percentile", r4(d.p25)], ["Average Backstop Intensity", r4(d.average)], ["High Backstop Intensity", r4(d.p90)]];
    }
    const byYear = (rows) => rows.slice().sort((a, b) => a.Year - b.Year);
    function std(a) { const n = a.length; if (n < 2) return NaN; const m = a.reduce((s, v) => s + v, 0) / n; return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / (n - 1)); }
    function revenueVolatility(rows, entity) {
      const rev = byYear(rows.filter((r) => r.Entity === entity)).map((r) => r[K.rev]).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
      if (rev.length < 3) return NaN;
      const g = [];
      for (let i = 1; i < rev.length; i++) g.push(rev[i] / rev[i - 1] - 1);
      if (g.length < 2 || g.some((v) => !isNum(v))) return NaN;
      return std(g);
    }
    const ratingIndex = (r) => { const i = CFG.RATING_SCALE_ASC.indexOf(r); return i < 0 ? null : i; };
    function notchChange(rows, entity) {
      const d = byYear(rows.filter((r) => r.Entity === entity && r.Rating !== undefined && r.Rating !== null));
      if (d.length < 2) return [null, null, null];
      const f = d[0].Rating, l = d[d.length - 1].Rating, fi = ratingIndex(f), li = ratingIndex(l);
      if (fi === null || li === null) return [f, l, null];
      return [f, l, li - fi];
    }
    function latestPerEntity(rows) {
      const m = new Map();
      for (const r of byYear(rows)) m.set(r.Entity, r);
      return [...m.values()];
    }

    /* ---------------- shocks.py ---------------- */
    function runScenario(base, p, H) {
      const num = (v, d) => (isNum(v) ? v : d);
      const dur = p.shock_duration_years;
      const fpath = fuelPath(p); // per-year fuel price path, or null for the step profile
      const cash0 = num(base["Cash and Equivalents"], NaN);
      const st = {
        EBIT: base[K.ebit], Interest: base[K.int], RE: base[K.re], Equity: base[K.eq], TL: base[K.tl], TA: base[K.ta],
        CA: base[K.ca], CL: base[K.cl], Revenue: base[K.rev], OpEx: base[K.opex],
        Recv: 0, VAT: 0, STDebt: 0, Payables: 0, LTDebt: 0, // stocks created by the shock
        // illiquid items already in the base-year current assets, where the file reports them (held flat)
        IlliquidOpen: num(base["Government Arrears Owed"], 0) + num(base["VAT Credits"], 0),
        // opening cash (0 when the file does not report it) and the drawdown not yet rebuilt
        Cash: isNum(cash0) ? cash0 : 0, CashDrawn: 0,

    const entity = S.kpi.soe;
    const years = supportRows(entity).filter((r) => r.Year >= S.kpi.from && r.Year <= S.kpi.to);
    const eligible = years.filter((r) => ok(r.Revenues) && r.Revenues > 0 && ok(r["Operating Profits (EBIT)"]) && ok(flowValue(r, "tariff_pso_compensation")));
    const c = supportCard("Reported vs tariff-compensation-adjusted EBIT margin", "Selected SOE · the effect of removing tariff/PSO compensation already included in reported revenue.");
    if (!eligible.length) {
      c.body.append(el("p", { class: "kpi-desc" }, "Data unavailable — requires reported revenue, EBIT and separately disclosed tariff / PSO compensation. No adjusted values are inferred from other grants."));
      document.getElementById("kpi").append(c.root);
      return;
    }
    const chart = el("div", { class: "chart" });
    const reported = years.map((r) => ok(r["Operating Profits (EBIT)"]) && r.Revenues > 0 ? r["Operating Profits (EBIT)"] / r.Revenues : NaN);
    const adjusted = years.map((r) => {
      const rev = r.Revenues - flowValue(r, "tariff_pso_compensation");
      return ok(flowValue(r, "tariff_pso_compensation")) && rev > 0 && ok(r["Operating Profits (EBIT)"]) ? (r["Operating Profits (EBIT)"] - flowValue(r, "tariff_pso_compensation")) / rev : NaN;
    });
    c.body.append(chart,
      el("div", { class: "legend-row" }, el("span", {}, "● Reported EBIT margin"), el("span", {}, "◆ Mechanical ex-tariff-compensation margin")),
      el("p", { class: "note" }, "Sensitivity only: subtract the same tariff/PSO compensation from EBIT and reported revenue, assuming the amount was booked within revenue and holding costs fixed. Not an audited restatement, not a policy counterfactual. Compensation is not added to revenue again."),
      dataButtons(() => toCSV(["SOE", "Year", "Reported EBIT margin", "Mechanical ex-compensation EBIT margin", "Compensation amount"], years.map((r, i) => [entity, r.Year, ok(reported[i]) ? reported[i] : "", ok(adjusted[i]) ? adjusted[i] : "", ok(flowValue(r, "tariff_pso_compensation")) ? flowValue(r, "tariff_pso_compensation") : ""])), "reported_vs_compensation_adjusted_margin.csv"));
    document.getElementById("kpi").append(c.root);
    lines(chart, years.map((r) => r.Year), [
      { vals: reported, cls: "ln-base", dot: "prev", label: "Reported EBIT margin" },
      { vals: adjusted, cls: "ln-str", dot: "now", label: "Mechanical ex-compensation margin" }
    ], { h: 235, zeroFloor: true, L: 65, R: 60,
      yFmt: (v) => pct(v, 0), tip: (i) => [[pct(reported[i], 2), "Reported EBIT margin"], [pct(adjusted[i], 2), "Mechanical ex-compensation"], [supportMoney(flowValue(years[i], "tariff_pso_compensation")), "Compensation already in revenue"]] });
  }
  function drawSupportFlows(box, years) {
    const W = Math.max(620, Math.round(widthOf(box))), H = 285, L = 74, R = 22, T = 17, B = 39;
    const max = Math.max(1, ...years.flatMap((r) => SUPPORT_FLOWS.map(([key]) => ok(flowValue(r, key)) ? Math.max(0, flowValue(r, key)) : 0)));
    const scale = Math.pow(10, Math.floor(Math.log10(max)));
    const top = Math.ceil(max / scale * 1.15 * 2) / 2 * scale;
    const sy = (v) => H - B - v / top * (H - B - T);
    const g = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Annual fiscal-support flows by category and year" });
    for (let i = 0; i <= 4; i++) {
      const v = top * i / 4, y = sy(v);
      svgEl("line", { x1: L, x2: W - R, y1: y, y2: y, class: "grid-l" }, g);
      txt(g, L - 8, y, money(v), "t-muted num", "end", 11);
    }
    const spacing = (W - L - R) / Math.max(1, years.length);
    const bw = Math.min(27, spacing / 6);
    years.forEach((r, i) => {
      const center = L + spacing * (i + 0.5);
      txt(g, center, H - 16, String(r.Year), "t-muted num", "middle", 11);
      SUPPORT_FLOWS.forEach(([key, label, color], j) => {
        if (!ok(flowValue(r, key))) return;
        const v = Math.max(0, flowValue(r, key));
        const x = center + (j - 1.5) * (bw + 3) - bw / 2;
        const rect = svgEl("rect", { x, y: sy(v), width: bw, height: Math.max(1.5, sy(0) - sy(v)), fill: color, rx: 2 }, g);
        const title = svgEl("title", {}, rect); title.textContent = `${r.Year} ${label}: ${supportMoney(flowValue(r, key))}`;
      });
    });
    box.replaceChildren(g);
  }
  function showSupportGRE() {
    const entity = S.gre.sel && S.names.includes(S.gre.sel) ? S.gre.sel : S.names[0];
    const rows = supportRows(entity);
    const c = supportCard("Historical fiscal-support flows", `${entity} · Annual flow amounts by type; the rating-uplift assessment is unchanged.`);
    if (!rows.some((r) => SUPPORT_FLOWS.some(([key]) => ok(flowValue(r, key))))) {
      c.body.append(el("p", { class: "kpi-desc" }, "Data unavailable — no separately disclosed tariff / PSO compensation, operating subsidy, investment grant or equity injection for this SOE. Missing categories are not assumed to be zero."));
      document.getElementById("gre").append(c.root);
      return;
    }
    const chart = el("div", { class: "chart" });
    const legend = el("div", { class: "legend-row" }, SUPPORT_FLOWS.map(([, lab, color]) => el("span", {}, el("i", { style: `display:inline-block;width:11px;height:11px;background:${color};margin-right:5px;border-radius:2px` }), lab)));
    const detail = rows.map((r) => [r.Year, ...SUPPORT_FLOWS.map(([key]) => supportMoney(flowValue(r, key))), ok(flowValue(r, "tariff_pso_compensation")) && ok(r.Revenues) && r.Revenues > 0 ? pct(flowValue(r, "tariff_pso_compensation") / r.Revenues, 1) : "—"]);
    c.body.append(legend, chart, simpleTable(["Year", "Tariff/PSO in revenue", "Operating subsidy", "Investment grant", "Equity injection", "Tariff/PSO / revenue"], detail, { right: (i) => i > 0 }),
      el("p", { class: "note" }, "Categories are displayed separately, not automatically summed: Government Grants may already represent tariff compensation, operating subsidies may overlap with other reported grants, and investment grants/equity injections are different accounting channels. Missing values are not zero. Grants_detail entries with stock or contingent basis are excluded from this annual-flow chart."),
      dataButtons(() => toCSV(["SOE", "Year", ...SUPPORT_FLOWS.map((x) => x[0])], rows.map((r) => [entity, r.Year, ...SUPPORT_FLOWS.map(([key]) => ok(flowValue(r, key)) ? flowValue(r, key) : "")])), "government_support_flows.csv"));
    document.getElementById("gre").append(c.root);
    drawSupportFlows(chart, rows);
  }
  function showSupportAssumptions() {
    const m = S.uploadExtras;
    const c = supportCard("Workbook evidence and validation", "Source references and consistency checks, when supplied with the workbook.");
    if (!m || !m.sheets.length) {
      c.body.append(el("p", { class: "kpi-desc" }, "Data unavailable — no supplemental workbook evidence has been loaded. Upload a workbook with Grants_detail, Source_lines or Validation sheets to populate this panel."));
      document.getElementById("assumptions").append(c.root);
      return;
    }
    const stats = new Map();
    m.validation.forEach((r) => { const k = String(r.Status || "(blank)"); stats.set(k, (stats.get(k) || 0) + 1); });
    const nerr = [...stats.entries()].filter(([k]) => !/^ok$/i.test(k)).reduce((s, [, v]) => s + v, 0);
    c.body.append(el("div", { class: "grid4 sm" },
        tile("Sheets linked", "ok", "Workbook", String(m.sheets.length), "", m.sheets.join(", ")),
        tile("Grant-detail records", null, null, String(m.grants.length), "", "Flows & stocks kept distinct"),
        tile("Validation rows", nerr ? "watch" : "ok", nerr ? "Review" : "Workbook OK", String(m.validation.length), "", [...stats].map(([k, v]) => `${k}: ${v}`).join(" · ") || "No validation rows"),
        tile("Matching discrepancies", m.conflicts.length ? "watch" : "ok", m.conflicts.length ? "Review" : "No conflicts", String(m.conflicts.length), "", `${m.merged} additional flow cells joined`)));
    if (m.conflicts.length || m.warnings.length) {
      c.body.append(el("details", { class: "plain" }, el("summary", {}, `${m.conflicts.length} conflicts · ${m.warnings.length} join warnings`),
        el("ul", { class: "caveats" }, [...m.conflicts, ...m.warnings].slice(0, 80).map((msg) => el("li", {}, msg)))));
    }
    if (m.grants.length) {
      const stock = m.grants.filter((r) => SUPPORT_STOCKS.has(String(r.Code || "").toLowerCase()) && numOrNull(Object.values(r)[2]) !== null);
      c.body.append(el("p", { class: "note" }, `Grants_detail: ${m.grants.length} records; ${stock.length} observations under loan/guarantee/tax-support codes with a recorded value. These are NOT treated as additional annual cash flows.`));
      c.body.append(simpleTable(["Code", "Year", "Value / disclosure", "Basis", "Source"], m.grants.slice(0, 60).map((r) => [r.Code || "", r.Year || "", Object.entries(r).find(([k]) => /^Value\b/i.test(k))?.[1] ?? "not reported", r.Basis || "", r.Source || ""]), { tall: true }));
    }
    if (m.validation.length) {
      c.body.append(el("details", { class: "plain" }, el("summary", {}, `Validation checks (${m.validation.length} rows, supplied in uploaded workbook)`),
        simpleTable(["Check", "Year", "Item", "Difference", "Status"], m.validation.slice(0, 300).map((r) => [r.Check || "", r.Year || "", r.Item || "", r.Difference ?? "", r.Status || ""]), { tall: true })));
    }
    if (m.sourceLines.length) {
      c.body.append(el("details", { class: "plain" }, el("summary", {}, `Source-line evidence (${m.sourceLines.length} records)`),
        simpleTable(["Code", "Statement label", ...S.years.map(String)], m.sourceLines.slice(0, 130).map((r) => [r.Code ?? "", r["SYSCOHADA line"] ?? "", ...S.years.map((y) => r[String(y)] ?? "")]), { tall: true })));
    }
    c.body.append(el("p", { class: "note" }, "This audit-trail panel does not establish that the uploaded financial reports were audited; review source and scope of the original Validation sheet. The model's assumed fuel / FX / floating-rate exposures are distinct from observed statement lines."));
    document.getElementById("assumptions").append(c.root);
  }
  function showSupportShock() {
    const latest = latestOf(S.rows), absent = latest.filter((r) => !["Fuel Cost Share", "FX Debt Share", "Floating Rate Debt Share"].some((k) => ok(r[k])));
    const c = supportCard("Exposure-data availability", "Observed input coverage for the existing shock scenarios.");
    c.body.append(el("p", { class: "note", style: "margin-top:0" },
      `${absent.length} of ${latest.length} SOE(s) have no observed fuel, FX-debt or floating-rate exposure-share columns. When a relevant exposure is unavailable, the existing shock engine uses its documented sector/generic defaults. Historical tariff compensation should not be equated mechanically with incremental fuel subsidies under the stress scenario.`));
    document.getElementById("shock").append(c.root);
  }
  // Wrap original render methods rather than replacing the existing dashboards.
  // A change in SOE/period or the GRE selection updates only the add-on card.
  [ ["about", showSupportHome], ["kpi", showSupportKPI], ["gre", showSupportGRE],
    ["assumptions", showSupportAssumptions], ["shock", showSupportShock] ].forEach(([tab, extra]) => {
    const original = pages[tab].render;
    pages[tab].render = function (...args) {
      const result = original.apply(this, args);
      const root = document.getElementById(tab);
      root.querySelectorAll(":scope > .upload-support-card").forEach((e) => e.remove());
      extra();
      return result;
    };
  });


  /* =====================================================================
     boot
     ===================================================================== */
  const startKey = DATASETS.report ? "report" : DATASETS.demo ? "demo" : "sample";
  const start = DATASETS[startKey];
  const h = (location.hash || "").slice(1).replace(/^view-/, "");
  if (pages[h]) S.tab = h;
  loadDataset(start.rows, start.label, start.example, startKey);
  let lastW = document.documentElement.clientWidth, raf = 0;
  new ResizeObserver(() => {
    const w = document.documentElement.clientWidth;
    if (w === lastW) return;
    lastW = w; cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => pages[S.tab].render());
  }).observe(document.body);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => pages[S.tab].render());
})();

</script>
<script>
/* Graph-only PNG export — runs after app.js, for every chart in every page. */
(() => {
  'use strict';
  const root = document.getElementById('wrap');
  if (!root) return;

  // Inline the SVG's COMPUTED styles: the on-screen chart relies on app.css
  // classes and CSS custom properties, which aren't available to a saved PNG.
  // Don't copy event handlers or charts' transient hover/focus graphics.
  const SVG_STYLES = [
    'fill', 'fill-opacity', 'fill-rule', 'stroke', 'stroke-width',
    'stroke-opacity', 'stroke-linecap', 'stroke-linejoin', 'stroke-dasharray',
    'stroke-dashoffset', 'opacity', 'font-family', 'font-size', 'font-weight',
    'font-style', 'letter-spacing', 'text-anchor', 'dominant-baseline',
    'visibility', 'paint-order', 'vector-effect', 'shape-rendering',
    'text-rendering'
  ];

  function chartFilename(box) {
    const page = box.closest('.page');
    const heading = box.closest('.card')?.querySelector('.card-head h3')?.textContent ||
      box.closest('section')?.querySelector('h2')?.textContent || 'Chart';
    const selection = box.closest('.card')?.querySelector('select option:checked')?.textContent || '';
    const name = [page?.id, heading, selection]
      .filter(Boolean).join('_').normalize('NFKD')
      .replace(/[^a-zA-Z0-9\u00C0-\uFFFF_-]+/g, '_').replace(/_+/g, '_')
      .replace(/^_|_$/g, '').slice(0, 115);
    return (name || 'SOE_chart') + '.png';
  }

  async function pngFromSVG(svg) {
    const originalViewBox = svg.viewBox && svg.viewBox.baseVal;
    const rect = svg.getBoundingClientRect();
    const width = originalViewBox?.width || parseFloat(svg.getAttribute('width')) || rect.width;
    const height = originalViewBox?.height || parseFloat(svg.getAttribute('height')) || rect.height;
    if (!(width > 0 && height > 0)) throw new Error('Chart has no visible dimensions');
    const scale = Math.min(3, 8192 / Math.max(width, height), 50000000 / (width * height));
    const output = document.createElement('canvas');
    output.width = Math.max(1, Math.round(width * scale));
    output.height = Math.max(1, Math.round(height * scale));
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', String(width));
    clone.setAttribute('height', String(height));
    if (!clone.getAttribute('viewBox')) clone.setAttribute('viewBox', `0 0 ${width} ${height}`);
    const nodes = [svg, ...svg.querySelectorAll('*')];
    const copied = [clone, ...clone.querySelectorAll('*')];
    for (let i = 0; i < nodes.length; i++) {
      const style = window.getComputedStyle(nodes[i]);
      for (const prop of SVG_STYLES) {
        const value = style.getPropertyValue(prop);
        if (value) copied[i].style.setProperty(prop, value);
      }
    }
    // Omit hit areas, which are for tooltips and should not be drawn to PNG.
    clone.querySelectorAll('.hit, .xhair').forEach((node) => node.remove());
    const documentElement = clone.ownerDocument;
    const background = documentElement.createElementNS('http://www.w3.org/2000/svg','rect');
    background.setAttribute('x', '0'); background.setAttribute('y', '0');
    background.setAttribute('width','100%'); background.setAttribute('height','100%');
    background.setAttribute('fill','#ffffff');
    clone.insertBefore(background, clone.firstChild);
    const svgText = new XMLSerializer().serializeToString(clone);
    const svgURL = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' }));
    try {
      const image = new Image();
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error('Browser could not render the chart image'));
        image.src = svgURL;
      });
      const ctx = output.getContext('2d');
      if (!ctx) throw new Error('Canvas rendering unavailable');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, output.width, output.height);
      ctx.drawImage(image, 0, 0, output.width, output.height);
      return await new Promise((resolve, reject) => {
        output.toBlob((b) => b ? resolve(b) : reject(new Error('PNG export failed')), 'image/png');
      });
    } finally { URL.revokeObjectURL(svgURL); }
  }

  async function saveChart(box, button) {
    const svg = box.querySelector(':scope > svg');
    if (!svg) return;
    const name = chartFilename(box);
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
    try {
      const blob = await pngFromSVG(svg);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    } catch (err) {
      console.error('SOE chart export:', err);
      const previous = button.title;
      button.title = `PNG export unavailable: ${err.message}`;
      setTimeout(() => { button.title = previous; }, 4500);
    } finally {
      button.disabled = false;
      button.removeAttribute('aria-busy');
    }
  }

  const icon = '<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4"/><path d="M4 17v4h16v-4"/></svg>';
  function addButtons() {
    root.querySelectorAll('.chart').forEach((box) => {
      const hasChart = Boolean(box.querySelector(':scope > svg'));
      const existing = box.querySelector(':scope > .chart-save-png');
      if (!hasChart) { if (existing) existing.remove(); return; }
      if (existing) return;
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'chart-save-png';
      button.setAttribute('aria-label', 'Download this chart as PNG');
      button.title = 'Download chart as PNG';
      button.innerHTML = icon;
      button.addEventListener('pointerenter', () => {
        const tip = document.getElementById('tip');
        if (tip) tip.hidden = true;
      });
      button.addEventListener('click', (event) => {
        event.preventDefault(); event.stopPropagation(); saveChart(box, button);
      });
      box.appendChild(button);
    });
  }

  // Charts are re-created on page navigation, year/SOE selection and uploads.
  // Observing their parent retains the button without changing chart renderers.
  let scheduled = false;
  const observer = new MutationObserver(() => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => { scheduled = false; addButtons(); });
  });
  observer.observe(root, { childList: true, subtree: true });
  addButtons();
})();

</script>
