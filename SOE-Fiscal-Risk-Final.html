<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>SOE Fiscal Risk Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Overpass:wght@400;600;700;800&display=swap">
<style>
/* Layout: navy title band, sticky tab bar (one page per tab), optional sector filter bar,
   then a 12-column panel grid. Simulator pages put controls on the left and results on the right.
   Palette: World Bank navy #002244 and bright blue #009FDA; good / watch / alert carry state. */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f5f7fa;
  --ink: #1c2530; --ink-2: #4c5a68; --muted: #76828f; --heading: #002244;
  --line: #e1e6ec; --axis: #c2cbd5;
  --band-bg: #002244; --band-ink: #ffffff; --band-ink-2: rgba(255, 255, 255, .78); --band-chip: rgba(255, 255, 255, .10);
  --accent: #009fda; --accent-strong: #0071bc; --accent-wash: rgba(0, 159, 218, .10);
  --chip-on-bg: #002244; --chip-on-ink: #ffffff;
  --prev: #a2adb9; --neg: #d03b3b;
  --good: #00a996; --warn: #f7b841; --crit: #d03b3b;
  --good-ink: #00796b; --warn-ink: #8a5d00; --crit-ink: #b12f2f;
  --good-wash: rgba(0, 169, 150, .10); --warn-wash: rgba(247, 184, 65, .20); --crit-wash: rgba(208, 59, 59, .09);
  --warn-wash-soft: rgba(247, 184, 65, .13);
  --flag-ink: #1c2530;
  --ring: rgba(0, 34, 68, .10);
  --f-sans: "Open Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07111c; --surface: #0d1a28; --surface-2: #122334;
    --ink: #e9eff5; --ink-2: #b2bfcc; --muted: #7f8d9c; --heading: #f2f6fa;
    --line: #1d3044; --axis: #2c435b;
    --band-bg: #001a33; --band-ink: #ffffff; --band-ink-2: rgba(255, 255, 255, .72); --band-chip: rgba(255, 255, 255, .08);
    --accent: #33b5e6; --accent-strong: #6fcbef; --accent-wash: rgba(51, 181, 230, .14);
    --chip-on-bg: #33b5e6; --chip-on-ink: #07111c;
    --prev: #5c6f83; --neg: #e66767;
    --good-ink: #2fcfb9; --warn-ink: #f7b841; --crit-ink: #ef7d7d;
    --good-wash: rgba(0, 169, 150, .18); --warn-wash: rgba(247, 184, 65, .18); --crit-wash: rgba(208, 59, 59, .22);
    --warn-wash-soft: rgba(247, 184, 65, .12);
    --flag-ink: #1c2530;
    --ring: rgba(255, 255, 255, .08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07111c; --surface: #0d1a28; --surface-2: #122334;
  --ink: #e9eff5; --ink-2: #b2bfcc; --muted: #7f8d9c; --heading: #f2f6fa;
  --line: #1d3044; --axis: #2c435b;
  --band-bg: #001a33; --band-ink: #ffffff; --band-ink-2: rgba(255, 255, 255, .72); --band-chip: rgba(255, 255, 255, .08);
  --accent: #33b5e6; --accent-strong: #6fcbef; --accent-wash: rgba(51, 181, 230, .14);
  --chip-on-bg: #33b5e6; --chip-on-ink: #07111c;
  --prev: #5c6f83; --neg: #e66767;
  --good-ink: #2fcfb9; --warn-ink: #f7b841; --crit-ink: #ef7d7d;
  --good-wash: rgba(0, 169, 150, .18); --warn-wash: rgba(247, 184, 65, .18); --crit-wash: rgba(208, 59, 59, .22);
  --warn-wash-soft: rgba(247, 184, 65, .12);
  --flag-ink: #1c2530;
  --ring: rgba(255, 255, 255, .08);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.inner { max-width: 1280px; margin: 0 auto; padding-inline: 24px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 24px; padding-block: 0 48px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; color: var(--heading); }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; }

/* title band */
.band { background: var(--band-bg); color: var(--band-ink); }
.band .inner { padding-block: 18px 16px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.band h1 { color: var(--band-ink); font-size: clamp(20px, 2.6vw, 26px); font-weight: 700; letter-spacing: -.01em; margin-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta span { font-size: 12px; color: var(--band-ink-2); background: var(--band-chip); border-radius: 2px; padding: 3px 9px; }
.meta span b { color: var(--band-ink); font-weight: 600; }
.meta .example-flag { background: var(--warn); color: var(--flag-ink); font-weight: 600; }

/* tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { display: block; padding: 13px 13px 10px; color: var(--ink-2); background: none; border: 0; border-bottom: 3px solid transparent; font-weight: 600; font-size: 13.5px; white-space: nowrap; cursor: pointer; }
.tabs button:hover { color: var(--heading); }
.tabs button[aria-selected="true"] { color: var(--heading); border-bottom-color: var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* filter bar */
.filterbar { background: var(--surface-2); border-bottom: 1px solid var(--line); }
.filterbar .inner { padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
.asof { font-size: 12px; color: var(--muted); white-space: nowrap; }
.asof b { color: var(--heading); font-weight: 700; }

/* pages */
.page { padding-top: 22px; }
.page-head { margin-bottom: 16px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.page-head > div:first-child { min-width: 0; max-width: 820px; }
.page-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin-top: 3px; }
.page-head p { margin: 4px 0 0; color: var(--ink-2); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; } .s3 { grid-column: span 3; }
.stack { display: grid; gap: 16px; min-width: 0; }
@media (max-width: 1080px) { .s3 { grid-column: span 6; } }
@media (max-width: 960px) { .s8, .s7, .s6, .s5, .s4 { grid-column: span 12; } }
@media (max-width: 560px) { .s3 { grid-column: span 12; } }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid4.sm { grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; }
.grid4.sm .tile-value, .grid3.sm .tile-value { font-size: 21px; }
@media (max-width: 1080px) { .grid4:not(.sm) { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .grid4, .grid4:not(.sm), .grid3 { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--surface); border: 1px solid var(--ring); border-radius: var(--r); padding: 18px; min-width: 0; }
.card.top { border-top: 3px solid var(--heading); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 12px; }
.card-head > div:first-child { min-width: 0; flex: 1 1 200px; }
.card-head h3 { font-size: 15px; font-weight: 700; }
.card-head .sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.card-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note { font-size: 12.5px; color: var(--ink-2); margin: 10px 0 0; max-width: 110ch; }
.note b { color: var(--ink); font-weight: 600; }
.foot { font-size: 12px; color: var(--muted); border-top: 2px solid var(--heading); padding-top: 10px; margin-top: 22px; display: grid; gap: 4px; }
.foot b { color: var(--ink-2); }
.summary { background: var(--accent-wash); border-left: 3px solid var(--accent); border-radius: 3px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
.summary .tag { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.alert-box { font-size: 13px; padding: 9px 12px; border-radius: 3px; background: var(--surface-2); }
.alert-box.warn { background: var(--crit-wash); box-shadow: inset 3px 0 0 var(--crit); }
.alert-box.ok { background: var(--good-wash); box-shadow: inset 3px 0 0 var(--good); }
.alert-box.hint { background: var(--accent-wash); box-shadow: inset 3px 0 0 var(--accent); }
.divider { height: 1px; background: var(--line); margin: 16px 0; border: 0; }
.muted { color: var(--muted); }

/* controls */
.btn { font-size: 12.5px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 2px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--heading); color: var(--heading); }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); color: var(--surface); }
.btn-ghost { font-size: 12px; font-weight: 600; color: var(--accent-strong); background: transparent; border: 1px solid var(--line); border-radius: 2px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
.btn-ghost:hover { background: var(--accent-wash); }
.btn:focus-visible, .btn-ghost:focus-visible, .chip:focus-visible, .seg button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld > label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.fld > label output { font-weight: 700; color: var(--heading); font-variant-numeric: tabular-nums; }
.fld small { font-size: 11.5px; color: var(--muted); }
select, input[type="number"], input[type="text"] { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 2px; padding: 5px 8px; max-width: 100%; min-width: 0; }
input[type="range"] { width: 100%; margin: 2px 0; accent-color: var(--accent-strong); }
.fields { display: grid; gap: 12px; }
.fields.two { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
@media (max-width: 460px) { .fields.two { grid-template-columns: minmax(0, 1fr); } }
.row-ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.row-ctl .fld { min-width: 160px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--axis); border-radius: 2px; overflow: hidden; }
.seg button { font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 0; border-right: 1px solid var(--axis); padding: 6px 12px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--chip-on-bg); color: var(--chip-on-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips-label { font-size: 12px; color: var(--muted); margin-right: 4px; font-weight: 600; }
.chip { font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 3px 10px; cursor: pointer; }
.chip:hover { border-color: var(--axis); color: var(--heading); }
.chip[aria-pressed="true"] { background: var(--chip-on-bg); border-color: var(--chip-on-bg); color: var(--chip-on-ink); }
.subtabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.subtabs button[aria-selected="true"] { color: var(--heading); border-bottom-color: var(--accent); }
.info { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font-size: 10px; font-weight: 700; cursor: help; margin-left: 5px; vertical-align: 1px; font-style: normal; }
.info:hover, .info:focus-visible { border-color: var(--accent-strong); color: var(--accent-strong); outline: none; }
details.card > summary, details.plain > summary { cursor: pointer; font-weight: 700; color: var(--heading); font-size: 14px; list-style-position: outside; }
details.card[open] > summary { margin-bottom: 12px; }
details.plain { margin-top: 10px; }
details.plain > summary { font-size: 12.5px; color: var(--accent-strong); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.sticky-panel { position: sticky; top: 64px; }
@media (max-width: 960px) { .sticky-panel { position: static; } }
.dropzone { border: 1px dashed var(--axis); border-radius: 3px; padding: 14px; display: grid; gap: 8px; justify-items: start; background: var(--surface-2); }
.dropzone.over { border-color: var(--accent); background: var(--accent-wash); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn-row .btn { white-space: normal; text-align: left; }

/* status */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px 2px 7px; border-radius: 2px; white-space: nowrap; color: var(--ink); }
.st i { font-style: normal; font-size: 9px; line-height: 1; }
.st.ok { background: var(--good-wash); } .st.ok i { color: var(--good-ink); }
.st.watch { background: var(--warn-wash); } .st.watch i { color: var(--warn-ink); }
.st.alert { background: var(--crit-wash); } .st.alert i { color: var(--crit-ink); }
.st.none { background: var(--surface-2); color: var(--muted); }

/* hero + tiles */
.hero { display: grid; gap: 14px; align-content: start; }
.hero-label { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.hero-value { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -.02em; color: var(--heading); display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.hero-value small { font-size: 14px; font-weight: 400; color: var(--ink-2); letter-spacing: 0; }
.zonebar { display: flex; gap: 2px; height: 12px; }
.zonebar div { min-width: 2px; }
.zonebar div:first-child { border-radius: 2px 0 0 2px; }
.zonebar div:last-child { border-radius: 0 2px 2px 0; }
.zonelegend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; }
.zonelegend > span { display: inline-flex; align-items: center; gap: 6px; }
.zonelegend b { font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; min-width: 0; }
@media (max-width: 520px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile { display: grid; gap: 6px; align-content: start; border-top: 3px solid var(--heading); }
/* key-figure boxes: a translucent wash of the status colour over the card, no outline; the status chip
   becomes plain coloured text so the box does not carry two coloured shapes */
.card.tile { border: 0; --tint: var(--accent-wash); background: linear-gradient(var(--tint), var(--tint)), var(--surface); }
.card.tile.t-alert { --tint: var(--crit-wash); }
.card.tile.t-watch { --tint: var(--warn-wash-soft); }
.card.tile.t-ok { --tint: var(--good-wash); }
.card.tile.t-neutral { --tint: var(--accent-wash); }
.card.tile .st { background: transparent; padding: 0; }
.card.tile .st.alert { color: var(--crit-ink); } .card.tile .st.watch { color: var(--warn-ink); } .card.tile .st.ok { color: var(--good-ink); }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile-label { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.tile-value { font-size: 28px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; color: var(--heading); overflow-wrap: anywhere; }
.tile-value small { font-size: 13px; font-weight: 400; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }
.tile-sub { font-size: 12.5px; color: var(--muted); }

/* tables */
.tbl-wrap { position: relative; overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
.tbl-wrap.tall { max-height: 420px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11.5px; font-weight: 700; color: var(--heading); letter-spacing: .01em; padding: 8px 10px; border-bottom: 2px solid var(--heading); white-space: nowrap; vertical-align: bottom; background: var(--surface); }
.tbl-wrap.tall th { position: sticky; top: 0; z-index: 1; }
th[title] { cursor: help; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
th.r, td.r { text-align: right; }
td.r { white-space: nowrap; }
table.compact th, table.compact td { padding-inline: 7px; }
tbody tr:last-child td { border-bottom: none; }
tfoot td { border-top: 2px solid var(--heading); border-bottom: none; font-weight: 700; }
td.name { white-space: nowrap; }
td.name .nm { font-weight: 700; font-size: 13px; color: var(--heading); display: block; }
td.name .sec { color: var(--muted); font-size: 12px; display: block; }
.cell { display: inline-flex; flex-direction: column; gap: 1px; }
.cell .v { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.cell .v i { font-style: normal; font-size: 9px; }
.cell .d { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
td.ok .v i { color: var(--good-ink); } td.watch .v i { color: var(--warn-ink); } td.alert .v i { color: var(--crit-ink); }
td.alert { background: var(--crit-wash); } td.watch { background: var(--warn-wash); }
td.na .v { color: var(--muted); font-weight: 400; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background-color: var(--accent-wash); }
tr.pick.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tr.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
table.ctl-table td { vertical-align: middle; }
table.ctl-table select { font-size: 12.5px; padding: 3px 6px; max-width: 150px; }
.flagcount { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.pips { display: inline-flex; gap: 1px; }
.pips span { width: 3px; height: 12px; border-radius: 1px; background: var(--line); }
.pips span.on { background: var(--crit); }
.pips span.w { background: var(--warn); }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend-row.top { margin: 0 0 8px; }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.legend-row span.lt { display: inline; }
#compTable tr.main td { border-bottom: none; padding-bottom: 4px; }
#compTable tr.read td { padding-top: 0; }
.reading { white-space: normal; font-size: 12.5px; color: var(--ink-2); max-width: 120ch; }
.reading .flag { display: inline-flex; align-items: center; gap: 5px; margin: 4px 8px 0 0; color: var(--ink); font-weight: 600; background: var(--warn-wash); border-radius: 2px; padding: 1px 7px; }
.reading .flag::before { content: "▲"; color: var(--warn-ink); font-size: 9px; }
.mini { display: grid; grid-template-columns: minmax(56px, 110px) 48px; align-items: center; gap: 8px; }
.mini .val { text-align: right; font-weight: 600; font-size: 12.5px; }
.kpi-desc { font-size: 12px; color: var(--muted); margin: 8px 0 0; min-height: 3.2em; }

/* charts */
.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
/* Download controls appear on hover or keyboard focus; they are not drawn in exported images. */
.chart > .chart-save-png {
  position: absolute; z-index: 6; top: 6px; right: 6px;
  width: 32px; height: 32px; padding: 5px; box-sizing: border-box;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--heading); background: rgba(255,255,255,.96);
  border: 1px solid var(--ring); border-radius: 5px;
  box-shadow: 0 1px 5px rgba(0, 25, 47, .15);
  cursor: pointer; opacity: 0; pointer-events: none;
  transition: opacity .14s ease;
}
.chart:hover > .chart-save-png,
.chart:focus-within > .chart-save-png,
.chart > .chart-save-png:focus-visible {
  opacity: 1; pointer-events: auto;
}
.chart > .chart-save-png:hover { background: var(--accent-wash); }
.chart > .chart-save-png:disabled { cursor: wait; opacity: .6; }
.chart > .chart-save-png:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (hover: none) { .chart > .chart-save-png { opacity: 1; pointer-events: auto; } }
@media print { .chart > .chart-save-png { display: none !important; } }

.t-ink { fill: var(--ink); } .t-ink2 { fill: var(--ink-2); } .t-muted { fill: var(--muted); } .t-head { fill: var(--heading); }
.grid-l { stroke: var(--line); stroke-width: 1; }
.axis-l { stroke: var(--axis); stroke-width: 1; }
.zero-l { stroke: var(--ink-2); stroke-width: 1; }
.bar { fill: var(--accent); }
.bar.neg { fill: var(--neg); }
.bar.hl { fill: var(--heading); }
.bar.st-ok { fill: var(--good); } .bar.st-watch { fill: var(--warn); } .bar.st-alert { fill: var(--crit); } .bar.st-none { fill: var(--prev); }
.bar.soft { fill: var(--accent); opacity: .55; }
.hit { fill: transparent; cursor: default; outline: none; }
.hit:focus-visible { stroke: var(--accent); stroke-width: 1.5; }
g.row:hover .bar:not(.st-ok):not(.st-watch):not(.st-alert), g.row:focus-within .bar:not(.st-ok):not(.st-watch):not(.st-alert) { fill: var(--accent-strong); }
g.row:hover .bar.neg { fill: var(--neg); filter: brightness(.9); }
.z-crit { fill: var(--crit-wash); } .z-warn { fill: var(--warn-wash); }
.z-lab { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.dot-prev { fill: var(--surface); stroke: var(--prev); stroke-width: 2; }
.dot-now { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.dot-hl { fill: var(--heading); stroke: var(--surface); stroke-width: 2; }
.dot-max { fill: var(--heading); stroke: var(--surface); stroke-width: 2; }
.conn { stroke: var(--prev); stroke-width: 2; stroke-linecap: round; }
.ln { fill: none; stroke: var(--heading); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ln-base { fill: none; stroke: var(--prev); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ln-str { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ln-med { fill: none; stroke: var(--accent-strong); stroke-width: 2; }
.band-outer { fill: var(--accent); opacity: .12; } .band-inner { fill: var(--accent); opacity: .22; }
.ref-l { stroke: var(--heading); stroke-width: 1.5; }
.thr-crit { stroke: var(--crit); stroke-width: 1.5; } .thr-warn { stroke: var(--warn-ink); stroke-width: 1.5; }
.thr-good { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .thr-crit, .legend-row .thr-crit { stroke-dasharray: 5 4; }
.act-band { fill: var(--accent); opacity: .45; }
.xhair { stroke: var(--axis); stroke-width: 1; }
.lad-cell { fill: var(--surface-2); stroke: var(--line); }
.lad-cell.span { fill: var(--accent-wash); }
.lad-arrow { stroke: var(--accent-strong); stroke-width: 2; fill: none; }

.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); box-shadow: 0 6px 20px rgba(0, 20, 40, .16); border-radius: 3px; padding: 8px 10px; font-size: 12.5px; min-width: 140px; max-width: 300px; }
.tip-title { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.tip-row { display: flex; align-items: baseline; gap: 8px; }
.tip-row strong { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--heading); }
.tip-row span { color: var(--ink-2); }

/* signal board */
.zboard { display: grid; gap: 10px; }
.zcol { border-radius: 3px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.zcol.alert { background: var(--crit-wash); } .zcol.watch { background: var(--warn-wash); } .zcol.ok { background: var(--good-wash); }
.zcol h4 { margin: 0; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; gap: 6px; color: var(--heading); }
.zcol h4 i { font-style: normal; font-size: 9px; }
.zcol.alert h4 i { color: var(--crit-ink); } .zcol.watch h4 i { color: var(--warn-ink); } .zcol.ok h4 i { color: var(--good-ink); }
.zcol h4 .cnt { color: var(--ink-2); font-weight: 400; }
.zcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.ctry { background: var(--surface); border-radius: 2px; padding: 6px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; box-shadow: 0 0 0 1px var(--ring); min-width: 0; }
.ctry > span:first-child { min-width: 0; }
.ctry .nm { font-size: 12.5px; font-weight: 700; color: var(--heading); overflow-wrap: anywhere; }
.ctry .zv { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctry .zs { display: block; font-size: 11px; color: var(--muted); }
.zcol .empty { font-size: 11.5px; color: var(--muted); }
.soe-list { display: flex; flex-wrap: wrap; gap: 4px; min-width: 16ch; }
.soe-list span { font-size: 12px; font-weight: 600; color: var(--heading); background: var(--surface-2); border: 1px solid var(--line); border-radius: 2px; padding: 0 6px; white-space: nowrap; }
#rulesTable td:nth-child(2) { min-width: 22ch; } #rulesTable td:nth-child(3) { min-width: 28ch; }

/* results */
.results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 10px; }
@media (max-width: 440px) { .results { grid-template-columns: minmax(0, 1fr); } }
.res { border-radius: 3px; padding: 12px; background: var(--surface-2); display: grid; gap: 6px; align-content: start; }
.res.stress { box-shadow: inset 3px 0 0 var(--accent); }
.res.base { box-shadow: inset 3px 0 0 var(--prev); }
.res-h { font-size: 12px; color: var(--ink-2); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.res-z { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.res-z b { font-size: 26px; font-weight: 700; line-height: 1.1; color: var(--heading); }
.res-line { font-size: 13px; color: var(--ink-2); }
.res-line b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.contrib { display: grid; gap: 6px; }
.contrib-row { display: grid; grid-template-columns: 124px minmax(0, 1fr) 56px; gap: 8px; align-items: center; font-size: 12.5px; }
.contrib-row .lbl { color: var(--ink-2); white-space: nowrap; font-weight: 400; }
.contrib-row .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 12px; }
.track::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--axis); }
.track span { position: absolute; top: 1px; height: 10px; }
.track span.pos { left: 50%; background: var(--accent); border-radius: 0 2px 2px 0; }
.track span.neg { right: 50%; background: var(--neg); border-radius: 2px 0 0 2px; }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl li { display: grid; grid-template-columns: 74px 14px minmax(0, 1fr); gap: 10px; }
.tl .when { font-size: 12px; font-weight: 600; color: var(--heading); padding-top: 1px; text-align: right; }
.tl .rail { position: relative; }
.tl .rail::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl li:first-child .rail::before { top: 8px; } .tl li:last-child .rail::before { bottom: calc(100% - 8px); }
.tl .rail::after { content: ""; position: absolute; left: 2px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 2px var(--axis); }
.tl li.hot .rail::after { background: var(--crit); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--crit); }
.tl li.proj .rail::after { background: var(--accent); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--accent); }
.tl .what { padding-bottom: 14px; font-size: 13px; }
.tl .what .st { margin-left: 6px; vertical-align: 1px; }
.tl .what b { font-weight: 700; font-variant-numeric: tabular-nums; }

.glossary td:first-child { font-weight: 700; white-space: nowrap; color: var(--heading); }
.glossary td { white-space: normal; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13px; }
.steps a { color: var(--accent-strong); font-weight: 600; }
.load-error { margin: 24px 0; padding: 12px 14px; background: var(--crit-wash); border-radius: 3px; }

/* key figures at the top of every tab */
.statstrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 0 0 16px; }
.statstrip:empty { display: none; }
.statstrip .tile { padding: 14px 16px; }
.statstrip .tile-value { font-size: 26px; }
.statstrip .tile-sub { font-size: 12px; }
@media (max-width: 560px) {
  .statstrip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .statstrip .tile { padding: 10px 12px; gap: 4px; }
  .statstrip .tile-label { font-size: 12px; }
  .statstrip .tile-value { font-size: 21px; }
  .statstrip .tile-sub { font-size: 11px; }
}

/* home: load data (left half) and the portfolio overview (right half) */

.home-top > .s6 > .upload-card { height: 100%; }
.hero.compact { gap: 10px; }

.band-upload:hover { background: rgba(255, 255, 255, .12); }

@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.upl-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px 28px; }

.upl-more { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 4px; min-width: 0; }

.upl-side { border-left: 1px solid var(--line); padding-left: 24px; min-width: 0; }

.upl-side .now { display: grid; gap: 2px; font-size: 13px; }

.dz-text b { color: var(--heading); }

.sr-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
label.btn { display: inline-block; cursor: pointer; }
.ds-list { display: grid; gap: 6px; }
.ds { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; cursor: pointer; font-size: 13px; }
.ds b { color: var(--heading); }
.ds span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.ds:hover { background: var(--accent-wash); }
.ds.on { border-color: var(--accent); background: var(--accent-wash); }
.ds:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 860px) { .upl-grid { grid-template-columns: minmax(0, 1fr); } .upl-side { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 14px; } }

/* year range, long-list toggle */
.range-sel { display: flex; align-items: center; gap: 6px; }

.period-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; margin: 0 0 12px; }
.btn-ghost.more { color: var(--heading); border-color: var(--axis); }

/* home: toolkit modules, data quality */

.dq-bar span { display: block; min-width: 3px; }
.q0 { background: var(--heading); } .q1 { background: var(--accent); } .q2 { background: var(--warn); } .q3 { background: var(--prev); }

.facts { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 12.5px; color: var(--ink-2); }

/* report */
.rep-toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }

table.rules td:nth-child(3) { min-width: 28ch; }

    --line: #e1e6ec; --axis: #c2cbd5; --band-bg: #002244; --accent: #009fda; --accent-strong: #0071bc; --accent-wash: rgba(0, 159, 218, .10);
    --chip-on-bg: #002244; --chip-on-ink: #ffffff; --prev: #a2adb9; --neg: #d03b3b;
    --good-ink: #00796b; --warn-ink: #8a5d00; --crit-ink: #b12f2f; --good-wash: rgba(0, 169, 150, .10); --warn-wash: rgba(247, 184, 65, .20); --crit-wash: rgba(208, 59, 59, .09);

/* Monte Carlo result grid: six panels, inspired by the reviewed prototype. */
.mc-dashboard { display: grid; gap: 14px; min-width: 0; }
.mc-dash-head { display: flex; gap: 10px 18px; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; padding: 5px 1px 4px; }
.mc-dash-head h3 { font-size: 19px; line-height: 1.25; margin: 3px 0 2px; letter-spacing: -.025em; }
.mc-dash-eyebrow { font-weight: 700; letter-spacing: .09em; font-size: 10px; color: var(--accent-strong); text-transform: uppercase; }
.mc-dash-sub { font-size: 12px; color: var(--ink-2); margin-top: 5px; line-height: 1.6; }
.mc-dash-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
.mc-focus-button { border-radius: 5px; padding: 8px 12px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 700; color: var(--heading); cursor: pointer; }
.mc-focus-button:hover,.mc-focus-button:focus-visible { border-color: var(--accent); background: var(--accent-wash); outline-offset: 2px; }
.mc-dash-grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 14px; align-items: stretch; }
.mc-dash-grid > * { min-width: 0; display: flex; flex-direction: column; }
.mc-dash-grid > * > .card { width: 100%; height: 100%; }
.mc-col-main { grid-column: span 7; }
.mc-col-side { grid-column: span 5; }
.mc-col-half { grid-column: span 6; }
.mc-dashboard .card { border-radius: 6px; border-color: var(--line); padding: 16px; background: var(--surface); }
.mc-dashboard .card-head { margin-bottom: 9px; }
.mc-dashboard .card-head h3 { font-size: 13.4px; letter-spacing: -.005em; line-height: 1.42; }
.mc-dashboard .card-head .sub { font-size: 11.5px; }
.mc-dashboard .legend-row { font-size: 11px; gap: 5px 11px; margin-bottom: 6px; }
.mc-dashboard .chart svg { max-height: 360px; }
.mc-chart-help { font-size: 11.5px; line-height: 1.5; color: var(--muted); margin-top: auto; padding-top: 9px; }
.mc-dash-grid .mc-zone-card .card { background: linear-gradient(155deg, var(--accent-wash), transparent 75%), var(--surface); }
.mc-dash-grid .mc-zone-card .hero { align-items: flex-start; }
.mc-dash-grid .mc-zone-card .hero-value { font-variant-numeric: tabular-nums; letter-spacing: -.05em; }
.mc-dash-grid .mc-zone-card .hero-value small { letter-spacing: 0; }
.mc-compare-list { display: grid; gap: 12px; }
.mc-compare-row { display: grid; gap: 5px; }
.mc-compare-name { display:flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight:700; }
.mc-compare-name strong { font-size: 12px; font-variant-numeric: tabular-nums; }
.mc-compare-track { background: var(--surface-2); border-radius: 3px; height: 10px; overflow:hidden; }
.mc-compare-track span { display: block; height: 100%; border-radius: 3px; background: var(--accent-strong); }
.mc-compare-track .anchored { background: var(--prev); }
.mc-compare-row small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mc-dash-grid .mc-compare-card table { margin-top: 7px; }
.mc-dash-grid .mc-compare-card td,.mc-dash-grid .mc-compare-card th { font-size: 11px; padding: 6px 5px; }
.mc-dash-grid .mc-percentiles-card td,.mc-dash-grid .mc-percentiles-card th { font-size: 11.5px; padding: 7px 6px; }
.mc-dash-footnote { font-size: 11.5px; color: var(--ink-2); padding: 0 3px; margin: 2px 0 0; }
.mc-focus-mode { grid-template-columns: minmax(0, 1fr) !important; }
.mc-focus-mode > .sticky-panel { display: none; }
.mc-focus-mode > .s8 { grid-column: 1 / -1; }
.mc-focus-mode .mc-dash-grid .mc-col-main { grid-column: span 8; }
.mc-focus-mode .mc-dash-grid .mc-col-side { grid-column: span 4; }
@media(max-width:1190px) {
  .mc-dashboard .mc-dash-grid .mc-col-main,.mc-dashboard .mc-dash-grid .mc-col-side { grid-column: span 12; }
  .mc-focus-mode .mc-dash-grid .mc-col-main { grid-column: span 8; }
  .mc-focus-mode .mc-dash-grid .mc-col-side { grid-column: span 4; }
}
@media(max-width:960px) {
  .mc-dash-grid .mc-col-half,.mc-focus-mode .mc-dash-grid .mc-col-main,.mc-focus-mode .mc-dash-grid .mc-col-side { grid-column: span 12; }
}
@media(max-width:600px) {
  .mc-dashboard .card { padding: 13px; }
  .mc-dash-head h3 { font-size: 17px; }
  .mc-dash-head { gap: 14px; }
  .mc-dash-actions { width: 100%; }
  .mc-focus-button { width: 100%; }
}


/* Keep two-column result cards legible in the 8-column Streamlit simulator pane. */
@media(max-width:1190px) {
  .mc-dashboard .mc-dash-grid .mc-col-main { grid-column: span 7; }
  .mc-dashboard .mc-dash-grid .mc-col-side { grid-column: span 5; }
  .mc-dashboard .mc-dash-grid .mc-col-half { grid-column: span 6; }
}
@media(max-width:760px) {
  .mc-dashboard .mc-dash-grid .mc-col-main,
  .mc-dashboard .mc-dash-grid .mc-col-side,
  .mc-dashboard .mc-dash-grid .mc-col-half {grid-column:span 12;}
}
/* The narrow viewport is one-column even after wider two-column overrides. */
@media(max-width:760px) {
  .mc-dashboard .mc-dash-grid > .mc-col-main,
  .mc-dashboard .mc-dash-grid > .mc-col-side,
  .mc-dashboard .mc-dash-grid > .mc-col-half {grid-column:span 12;}
}
.switch-effect-note{border-left:3px solid var(--line);padding:7px 10px;margin:2px 0 10px;font-size:12px;line-height:1.5;color:var(--ink-2);background:var(--surface-2)}

/* Compact switches: prevent the large empty full-width On/Off rail. */
.fields .fld > .seg {justify-self:start; width:max-content; max-width:100%;}

.mc-settings-toggle{min-height:0; padding:0!important;}
/* GDP lookup and unit-aware controls (the selected unit is always explicit). */
/* Country GDP: series (LCU / US$) → country and year → value filled in automatically → units */
.gdp-control {display:grid;gap:8px;min-width:0;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--surface-2);}
.gdp-control > .lbl {margin-bottom:1px;}
.gdp-step {display:grid;gap:4px;min-width:0;}
.gdp-sub {font-size:11px;font-weight:600;color:var(--ink-2);}
.gdp-series {justify-self:start;max-width:100%;}
.gdp-series button {padding:4px 11px;min-height:28px;font-size:12px;}
.gdp-lookup-grid {display:grid;grid-template-columns:minmax(0,1.5fr) minmax(84px,1fr);gap:7px;}
.gdp-lookup-grid label {display:grid;gap:3px;font-size:11px;font-weight:600;color:var(--ink-2);}
.gdp-lookup-grid select {min-width:0;width:100%;padding:5px 7px;font-size:12.5px;}
.gdp-value {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:stretch;}
.gdp-value input {min-width:0;width:100%;font-size:14px;font-weight:700;color:var(--heading);font-variant-numeric:tabular-nums;padding:6px 8px;background:var(--surface);}
.gdp-value input.held {color:var(--ink-2);font-weight:600;border-color:var(--warn);border-style:dashed;}
.gdp-value select {font-size:12px;max-width:150px;}
.gdp-status {font-size:11.5px;line-height:1.5;color:var(--ink-2);overflow-wrap:anywhere;padding:6px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);}
.gdp-status.ok {border-color:transparent;background:var(--good-wash);color:var(--ink);}
.gdp-status.ok b {color:var(--good-ink);}
.gdp-status.warn {border-color:transparent;background:var(--warn-wash-soft);color:var(--ink);}
.gdp-status.warn b {color:var(--warn-ink);}
.gdp-status.busy {color:var(--muted);font-style:italic;}
.gdp-status .linkbtn {font:inherit;font-weight:700;color:var(--accent-strong);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;}
.gdp-source {font-size:11px;color:var(--muted);}
.gdp-source a {color:var(--accent-strong);}
.gdp-control > .gdp-confirm {display:flex;justify-content:flex-start;align-items:flex-start;gap:6px;font-size:11.5px;font-weight:400;color:var(--ink-2);}
.gdp-confirm[hidden] {display:none;}
.gdp-confirm input {margin:2px 0 0;}
@media(max-width:440px){.gdp-lookup-grid{grid-template-columns:1fr}}

/* =====================================================================
   Meeting 2026-10-26 additions: Home workflow and scope, Shock Scenarios
   panel (formula first, one shock at a time), bridges, ranking, How it works.
   ===================================================================== */
:root { --shock: #b0177f; --shock-wash: rgba(176, 23, 127, .09); --good-fill: #00a996; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --shock: #e36cbf; --shock-wash: rgba(227, 108, 191, .16); } }
:root[data-theme="dark"] { --shock: #e36cbf; --shock-wash: rgba(227, 108, 191, .16); }
.t-on { fill: #fff; } .t-crit { fill: var(--crit-ink); }
.z-safe { fill: var(--good-wash); }

/* Home */
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; counter-reset: none; }
.flow li a { display: grid; gap: 3px; align-content: start; height: 100%; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--ring); border-top: 3px solid var(--accent); border-radius: var(--r); padding: 10px 11px; }
.flow li a:hover { background: var(--accent-wash); }
.flow li a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.flow b { color: var(--heading); font-size: 13px; }
.flow span:not(.flow-n) { font-size: 12px; color: var(--ink-2); line-height: 1.4; }
.flow-n { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; background: var(--heading); color: var(--surface); font-size: 11.5px; font-weight: 700; }
@media (max-width: 1080px) { .flow { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 640px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.scope-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.scope-grid h4 { font-size: 13px; margin-bottom: 6px; }
.scope-grid ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 13px; color: var(--ink-2); }
.scope-grid b { color: var(--ink); }
.scope-in { border-left: 3px solid var(--good); padding-left: 12px; }
.scope-out { border-left: 3px solid var(--crit); padding-left: 12px; }
@media (max-width: 720px) { .scope-grid { grid-template-columns: minmax(0, 1fr); } }
.modules.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1080px) { .modules.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .modules.four { grid-template-columns: minmax(0, 1fr); } }
.not-this { margin-top: 16px; border-left: 3px solid var(--warn); }
.not-this h3 { font-size: 15px; margin-bottom: 8px; }
.not-this ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 13px; color: var(--ink-2); }
.not-this b { color: var(--ink); }
.analyst-fold { margin-top: 14px; }
.note.coming { margin-top: 8px; }

/* Shock Scenarios panel */
.shock-panel { max-height: calc(100vh - 76px); overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
@media (max-width: 960px) { .shock-panel { max-height: none; overflow: visible; } }
.panel-stack { gap: 12px; }
.panel-card { padding: 14px 16px; }
.step-h { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
.step-h h3 { font-size: 14.5px; }
.step-h .sub { margin: 1px 0 0; font-size: 12px; color: var(--muted); }
.step-n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--heading); color: var(--surface); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.efc-formula { display: flex; align-items: stretch; gap: 6px; margin: 0 0 12px; }
.efc-formula span { flex: 1 1 0; display: grid; gap: 1px; background: var(--surface-2); border-radius: 4px; padding: 6px 8px; font-size: 11px; color: var(--ink-2); line-height: 1.3; }
.efc-formula span b { font-size: 14px; color: var(--heading); }
.efc-formula i { align-self: center; font-style: normal; color: var(--muted); font-weight: 700; }
.shock-card > .seg { margin-bottom: 10px; }
.shock-card .fld + .fld { margin-top: 0; }
.shock-info { background: var(--shock-wash); border-left: 3px solid var(--shock); border-radius: 3px; padding: 8px 11px; margin: 10px 0; font-size: 12.5px; }
.shock-info p { margin: 0 0 5px; color: var(--ink-2); }
.shock-info b { color: var(--ink); }
.shock-info a { color: var(--accent-strong); font-weight: 600; font-size: 12.5px; }
.blk-h { font-size: 12px; font-weight: 700; color: var(--heading); text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 8px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; align-items: center; }
.presets.guide { margin-bottom: 10px; align-items: center; }
.presets.guide .btn-ghost[aria-pressed="true"] { background: var(--chip-on-bg); color: var(--chip-on-ink); border-color: var(--chip-on-bg); }
.active-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0 0; font-size: 12px; }
.achip { display: inline-flex; align-items: stretch; border: 1px solid var(--shock); border-radius: 7px; overflow: hidden; }
.achip.on { background: var(--shock-wash); }
.achip button { font-size: 12px; font-weight: 600; border: 0; background: none; color: var(--ink); padding: 3px 7px; cursor: pointer; }
.achip .achip-x { border-left: 1px solid var(--shock); color: var(--shock); padding: 3px 7px; }
.achip button:hover { background: var(--shock-wash); }
.std-list { display: flex; flex-wrap: wrap; gap: 6px; }
.std-list span { font-size: 12px; background: var(--surface-2); border-radius: 5px; padding: 3px 8px; color: var(--ink-2); }
.std-list b { color: var(--heading); }
.data-hint { font-size: 11.5px; margin: 10px 0 0; }
.data-hint b { color: var(--ink-2); }
details.fold { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px; }
details.fold > summary { cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--accent-strong); }
details.fold[open] > summary { margin-bottom: 10px; }
details.adv > summary { cursor: pointer; font-weight: 700; color: var(--heading); font-size: 14px; display: grid; gap: 2px; }
details.adv > summary small { font-weight: 400; font-size: 11.5px; color: var(--muted); }
details.card.res-fold { padding: 12px 16px; border-top: 0; }
details.card.res-fold > summary { cursor: pointer; font-size: 13.5px; font-weight: 700; color: var(--heading); }
details.card.res-fold > .card, details.card.res-fold > .stack { margin-top: 12px; }
details.card.res-fold > .card { border: 0; padding: 0; }
.tech-notes { margin-top: 18px; }
.view-note { color: var(--ink-2); }

/* how the shock travels */
.trans { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 18px; }
.trans-step { position: relative; display: grid; gap: 2px; align-content: start; background: var(--surface-2); border-radius: 5px; padding: 9px 10px; border-top: 3px solid var(--line); min-width: 0; }
.trans-step + .trans-step::before { content: "→"; position: absolute; left: -15px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; }
.trans-step.is-shock { background: var(--shock-wash); border-top-color: var(--shock); }

/* bridges and ranking */
.br-tot { fill: var(--prev); } .br-tot2 { fill: var(--heading); }
.br-bad { fill: var(--crit); } .br-good { fill: var(--good); } .br-zero { fill: var(--axis); }

/* Early Warning (grouped rules, action plan) */

.pick-chip:hover, .pick-chip:focus-visible { outline: 1px solid var(--heading); }

/* =====================================================================
   How it works: scrollytelling guide. Design adapted from the draft explainer
   "How SOE Pilot Works": cool blue-grey page, signage-blue line, transit rail of
   chapters, sticky stage on the left, step cards on the right, magenta for shocks.
   ===================================================================== */
.hw {
  --hw-bg: #f3f6f8; --hw-surface: #ffffff; --hw-ink: #16232e; --hw-ink2: #4a5966; --hw-rule: #d5dde3;
  --hw-line: #1f4e8c; --hw-line-soft: #dce6f3; --hw-line-mid: #8fb0da;
  --hw-health: #0b6e5a; --hw-health-soft: #d9efe9; --hw-grey: #66737e;
  --hw-risk: #a93226; --hw-risk-soft: #f6deda; --hw-amber: #86560f; --hw-amber-mid: #d9b47a; --hw-amber-soft: #f5e8d2;
  --hw-shock: #b0177f; --hw-shock-soft: #f3dceb;
  --hw-disp: "Overpass", "Segoe UI", Arial, sans-serif; --hw-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;

}

  --hw-bg: #0f1720; --hw-surface: #16212c; --hw-ink: #e6edf2; --hw-ink2: #a9b6c1; --hw-rule: #2b3946;
  --hw-line: #6ea4e8; --hw-line-soft: #1b2c40; --hw-line-mid: #2f5a8f; --hw-health: #4cc3a5; --hw-health-soft: #15332c; --hw-grey: #7c8994;
  --hw-risk: #f0786a; --hw-risk-soft: #3a1e1b; --hw-amber: #e3a84f; --hw-amber-mid: #7a5a28; --hw-amber-soft: #33281a; --hw-shock: #e36cbf; --hw-shock-soft: #3a1830; } }
:root[data-theme="dark"] .hw {
  --hw-bg: #0f1720; --hw-surface: #16212c; --hw-ink: #e6edf2; --hw-ink2: #a9b6c1; --hw-rule: #2b3946;
  --hw-line: #6ea4e8; --hw-line-soft: #1b2c40; --hw-line-mid: #2f5a8f; --hw-health: #4cc3a5; --hw-health-soft: #15332c; --hw-grey: #7c8994;
  --hw-risk: #f0786a; --hw-risk-soft: #3a1e1b; --hw-amber: #e3a84f; --hw-amber-mid: #7a5a28; --hw-amber-soft: #33281a; --hw-shock: #e36cbf; --hw-shock-soft: #3a1830; }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-tab="how"] { background: #0f1720; } }
:root[data-theme="dark"] body[data-tab="how"] { background: #0f1720; }
#how.page { padding-top: 0; }
.hw h1, .hw h2, .hw h3 { font-family: var(--hw-disp); color: var(--hw-ink); }
.hw b { font-weight: 700; }
.hw a { color: var(--hw-line); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* hero */
.hw-hero { padding: 48px 0 28px; }
.hw-kicker { font-family: var(--hw-disp); font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--hw-line); margin: 0 0 10px; animation: hwFade .6s ease both; }
.hw-hero h1 { font-size: clamp(2rem, 4.6vw, 3.4rem); font-weight: 800; line-height: 1.08; letter-spacing: -.01em; max-width: 22ch; animation: hwFade .7s ease .05s both; }
.hw-lede { font-size: 1.25rem; line-height: 1.55; color: var(--hw-ink2); max-width: 42rem; margin: 20px 0 28px; animation: hwFade .7s ease .15s both; }
.hw-actions { display: flex; flex-wrap: wrap; gap: 12px; animation: hwFade .7s ease .25s both; }
.hw-btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 6px; border: 2px solid var(--hw-line); font-family: var(--hw-disp); font-weight: 700; font-size: 1.0625rem; text-decoration: none; color: var(--hw-line); background: transparent; cursor: pointer; }
.hw-btn:hover { background: var(--hw-line-soft); }

.hw-btn.primary:hover { filter: brightness(1.12); }
.hw-chain { list-style: none; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin: 48px 0 8px; padding: 0; position: relative; }
.hw-chain::before { content: ""; position: absolute; left: calc(100% / 12); right: calc(100% / 12); top: 17px; height: 8px; background: var(--hw-line); border-radius: 4px; transform-origin: left; animation: hwGrow 1.5s cubic-bezier(.3,.7,.2,1) .3s both; }
.hw-chain li { display: grid; justify-items: center; gap: 10px; position: relative; text-align: center; }
.hw-chain-dot { width: 42px; height: 42px; border-radius: 50%; background: var(--hw-surface); border: 6px solid var(--hw-line); animation: hwPop .55s cubic-bezier(.3,1.6,.5,1) calc(.35s + var(--i) * .22s) both; }
.hw-chain-lab { font-family: var(--hw-disp); font-weight: 800; font-size: 16px; line-height: 1.2; animation: hwFade .6s ease calc(.45s + var(--i) * .22s) both; }
.hw-hero-foot { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-top: 18px; }
.hw-hero-foot p { margin: 0; font-size: 15px; color: var(--hw-ink2); max-width: 42rem; }
.hw-hero-foot .fld { min-width: 220px; }
@keyframes hwGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes hwPop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes hwFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes hwPulse { 0%, 100% { box-shadow: 0 0 0 3px var(--hw-ink); } 50% { box-shadow: 0 0 0 7px var(--hw-shock-soft), 0 0 0 3px var(--hw-ink); } }
@media (max-width: 640px) { .hw-hero { padding-top: 28px; } .hw-chain-lab { font-size: 11px; } .hw-chain-dot { width: 30px; height: 30px; border-width: 5px; } .hw-chain::before { top: 11px; height: 6px; } .hw-lede { font-size: 1.0625rem; } }

/* transit rail */
.hw-rail { position: sticky; top: 46px; z-index: 5; background: var(--hw-bg); border-bottom: 1px solid var(--hw-rule); margin: 0 -24px; padding: 8px 24px 6px; min-height: var(--hw-rail-h); }
.hw-rail-st { position: relative; display: flex; list-style: none; margin: 0; padding: 0; }
.hw-rail-st::before { content: ""; position: absolute; left: calc(100% / 24); right: calc(100% / 24); top: 14px; height: 6px; margin-top: -3px; background: var(--hw-rule); border-radius: 3px; }
.hw-rail-st::after { content: ""; position: absolute; left: calc(100% / 24); top: 14px; height: 6px; margin-top: -3px; background: var(--hw-line); border-radius: 3px; width: calc((100% - 100% / 12) * var(--progress, 0)); transition: width .4s ease; }
.hw-rail-st li { position: relative; z-index: 1; flex: 1 1 0; min-width: 0; display: grid; justify-items: center; gap: 2px; }
.hw-st { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--hw-surface); color: var(--hw-ink); border: 3px solid var(--hw-line); font-family: var(--hw-disp); font-weight: 800; font-size: 13px; line-height: 1; text-decoration: none; transition: background .25s, color .25s, box-shadow .25s; }
.hw a.hw-st { color: var(--hw-ink); }
.hw-st.is-passed { background: var(--hw-line); color: var(--hw-surface) !important; }
.hw-st.is-current { background: var(--hw-ink); color: var(--hw-surface) !important; box-shadow: 0 0 0 3px var(--hw-bg), 0 0 0 5px var(--hw-line); }
.hw-rail-lab { font-size: 11.5px; line-height: 16px; color: var(--hw-ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.hw-rail-lab.is-current { color: var(--hw-ink); font-weight: 700; }
.hw-rail-now { display: none; font-size: 12px; font-weight: 700; color: var(--hw-ink); margin-top: 2px; }
@media (max-width: 1099px) { .hw-rail-lab { display: none; } .hw-rail-now { display: block; } }
@media (max-width: 640px) { .hw-rail { margin: 0 -16px; padding-inline: 16px; } .hw-st { width: 22px; height: 22px; border-width: 2.5px; font-size: 10.5px; } .hw-rail-st::before, .hw-rail-st::after { top: 11px; } }

/* chapters: sticky stage + step cards */
.hw-ch { scroll-margin-top: 120px; }
.hw-ch-h { display: flex; align-items: center; gap: 14px; margin: 84px 0 26px; }
.hw-ch-h h2 { font-size: 1.75rem; font-weight: 800; line-height: 1.15; max-width: 36ch; }
.hw-num { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: var(--hw-line); color: var(--hw-surface); font-family: var(--hw-disp); font-weight: 800; font-size: 1.125rem; }
.hw-num.map { background: var(--hw-ink); }
.hw-grid { display: grid; grid-template-columns: minmax(0, 1fr) 26rem; gap: 48px; align-items: start; }
.hw-stage { position: sticky; top: calc(46px + var(--hw-rail-h) + 14px); height: min(calc(100vh - 46px - var(--hw-rail-h) - 30px), 820px); min-height: 380px; }
.hw-stage-box { position: relative; width: 100%; height: 100%; background: var(--hw-surface); border: 1px solid var(--hw-rule); border-radius: 6px; overflow: hidden; }
.hw-stage-box > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.sk-h { position: absolute; inset: 0; pointer-events: none; }
.hw-steps { min-width: 0; padding-top: 12vh; }
.hw-step { position: relative; margin: 0 0 62vh; padding: 0 0 0 18px; border-left: 3px solid transparent; opacity: .5; transition: opacity .3s ease, border-color .3s ease; scroll-margin-top: 45vh; }
.hw-step:last-child { margin-bottom: 42vh; }
.hw-step.is-active { opacity: 1; border-left-color: var(--hw-line); }
.hw-step-text { font-size: 1.125rem; line-height: 1.62; }

.hw-open { display: inline-flex; align-items: center; margin-top: 12px; padding: 5px 13px; border: 2px solid var(--hw-line); border-radius: 6px; background: transparent; color: var(--hw-line); font-family: var(--hw-disp); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; }
.hw-open:hover { background: var(--hw-line-soft); }

@media (max-width: 959px) {
  .hw-grid { display: block; }
  .hw-stage { height: 46vh; min-height: 0; z-index: 4; top: calc(46px + var(--hw-rail-h)); margin: 0 -16px; }
  .hw-stage-box { border-radius: 0 0 6px 6px; }
  .hw-steps { padding-top: 34vh; position: relative; z-index: 3; }
  .hw-step { margin-bottom: 55vh; padding: 14px; background: var(--hw-surface); border: 1px solid var(--hw-rule); border-left-width: 4px; border-radius: 6px; opacity: .92; }
  .hw-step.is-active { border-left-color: var(--hw-line); }
  .hw-step:last-child { margin-bottom: 30vh; }
  .hw-step-text { font-size: 1.0625rem; }
  .hw-ch-h { margin-top: 56px; }
  .hw-ch-h h2 { font-size: 1.375rem; }
}

/* stage shapes: transforms place them, transitions animate every change */
.sk [data-k] { transform-box: view-box; transform-origin: 0 0; transition: transform .85s cubic-bezier(.22,.8,.24,1), opacity .5s ease, fill .5s ease, stroke .5s ease; }
.sk rect, .sk circle, .sk line, .sk path { vector-effect: non-scaling-stroke; }
.sk .sk-off, .sk-h > .sk-off { opacity: 0 !important; pointer-events: none !important; }
.sk text { font-family: var(--hw-body); }
.sk .t-disp { font-family: var(--hw-disp); }
.sk .t-ink { fill: var(--hw-ink); } .sk .t-ink2 { fill: var(--hw-ink2); } .sk .t-line { fill: var(--hw-line); } .sk .t-risk { fill: var(--hw-risk); }
.sk .t-health { fill: var(--hw-health); } .sk .t-amber { fill: var(--hw-amber); } .sk .t-shock { fill: var(--hw-shock); } .sk .t-on { fill: #fff; }
.sk .f-line { fill: var(--hw-line); } .sk .f-line-soft { fill: var(--hw-line-soft); } .sk .f-line-mid { fill: var(--hw-line-mid); }
.sk .f-health { fill: var(--hw-health); } .sk .f-health-soft { fill: var(--hw-health-soft); } .sk .f-risk { fill: var(--hw-risk); } .sk .f-risk-soft { fill: var(--hw-risk-soft); }
.sk .f-amber { fill: var(--hw-amber); } .sk .f-amber-mid { fill: var(--hw-amber-mid); } .sk .f-amber-soft { fill: var(--hw-amber-soft); }
.sk .f-shock { fill: var(--hw-shock); } .sk .f-shock-soft { fill: var(--hw-shock-soft); } .sk .f-shock-area { fill: var(--hw-shock); fill-opacity: .14; }
.sk .f-grey { fill: var(--hw-grey); } .sk .f-rule { fill: var(--hw-rule); } .sk .f-surface { fill: var(--hw-surface); } .sk .f-ink { fill: var(--hw-ink); }
.sk .s-ink { stroke: var(--hw-ink); } .sk .s-ink2 { stroke: var(--hw-ink2); } .sk .s-line { stroke: var(--hw-line); } .sk .s-risk { stroke: var(--hw-risk); }
.sk .s-shock { stroke: var(--hw-shock); } .sk .s-grey { stroke: var(--hw-grey); } .sk .s-rule { stroke: var(--hw-rule); }
.sk .w2 { stroke-width: 2; } .sk .w3 { stroke-width: 3; } .sk .nofill { fill: none; } .sk .dash { stroke-dasharray: 6 5; } .sk .soft { stroke-opacity: .5; stroke-linecap: round; }
.sk path.s-line, .sk path.s-ink2, .sk path.s-risk { fill: none; }
.sk .s-risk-dash { stroke: var(--hw-risk); stroke-dasharray: 5 4; stroke-width: 1.5; } .sk .s-line-dash { stroke: var(--hw-line); stroke-dasharray: 6 4; stroke-width: 1.5; }
.sk line { stroke-linecap: round; }
.sk .shadow { filter: drop-shadow(0 4px 10px rgba(22, 35, 46, .14)); }
.sk .hw-station { fill: var(--hw-surface); stroke: var(--hw-line); stroke-width: 3; } .sk .hw-station.past { fill: var(--hw-line); } .sk .hw-station.on { fill: var(--hw-ink); stroke: var(--hw-line); stroke-width: 4; }
.sk .rag-red { fill: var(--hw-risk); } .sk .rag-amber { fill: var(--hw-amber-mid); } .sk .rag-green { fill: var(--hw-health); } .sk .rag-muted { fill: var(--hw-rule); }
.sk .dot-risk, .sk .dot-riskf { fill: var(--hw-risk); } .sk .dot-amber { fill: var(--hw-amber); } .sk .dot-health { fill: var(--hw-health); } .sk .dot-grey { fill: var(--hw-grey); }
.sk .dot-mute { fill: var(--hw-rule); } .sk .dot-mute2 { fill: var(--hw-grey); } .sk .dot-ink { fill: var(--hw-ink); } .sk .dot-sh { fill: var(--hw-shock); fill-opacity: .55; }
.sk .dot-q0 { fill: #f2c4be; } .sk .dot-q1 { fill: #e39288; } .sk .dot-q2 { fill: #cf6458; } .sk .dot-q3 { fill: #b83b2f; } .sk .dot-q4 { fill: #7e1d15; }
.sk .ex { stroke: var(--hw-ink); stroke-width: 2.5; }
/* stage cards (HTML) */
.sk-card { position: absolute; left: 0; top: 0; pointer-events: auto; background: var(--hw-surface); border: 1.5px solid var(--hw-rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; font-size: 14px; line-height: 1.35; color: var(--hw-ink); box-shadow: 0 6px 18px rgba(22, 35, 46, .08); transition: transform .85s cubic-bezier(.22,.8,.24,1), opacity .5s ease, background .4s ease, border-color .4s ease; }
.sk-card small { color: var(--hw-ink2); font-size: 12px; }
.sk-k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--hw-ink2); font-weight: 700; }
.sk-big { font-family: var(--hw-disp); font-size: 24px; font-weight: 800; }

.sk-card.mini.ex { box-shadow: 0 0 0 3px var(--hw-ink); }
.sk-card.tile { padding: 6px 9px; box-shadow: none; } .sk-card.tile b { font-family: var(--hw-disp); font-size: 16px; }
.sk-card.tile.sm { padding: 4px 6px; align-content: start; } .sk-card.tile.sm .sk-k { font-size: 9.5px; letter-spacing: .02em; } .sk-card.tile.sm b { font-size: 14px; }
.sk-card.tile.on { border-color: var(--hw-line); background: var(--hw-line-soft); } .sk-card.tile.dim { opacity: .45; } .sk-card.tile.neg b { color: var(--hw-risk); }
.sk-card.stamp { border: 3px solid var(--hw-risk); color: var(--hw-risk); } .sk-card.stamp b { font-family: var(--hw-disp); font-size: 17px; }

.sk-card.node.focus { box-shadow: 0 0 0 3px var(--hw-ink); animation: hwPulse 1.4s ease 2; }

ility","liquidity":"Liquidity","solvency":"Solvency","fiscal_dependency":"Fiscal dependency"},"CATEGORY_ORDER":["profitability","liquidity","solvency","fiscal_dependency"],"SECTOR_FUEL_COST_SHARE":{"Transport":0.38,"Energy":0.25,"Power / Utilities":0.25,"Agriculture":0.2,"Industry":0.15,"Telecoms":0.15,"Other":0.2},"SECTOR_REVENUE_VOLATILITY":{"Transport":0.15,"Energy":0.1,"Power / Utilities":0.1,"Agriculture":0.2,"Industry":0.12,"Telecoms":0.08,"Other":0.15},"DEFAULT_SHOCK_PARAMS":{"fuel_shock_pct":0.25,"tariff_passthrough":0.5,"fx_shock_pct":0.3,"fx_cost_share":0.2,"fx_revenue_share":0.1,"fx_debt_share":0.3,"floating_debt_share":0.4,"rate_shock_bps":200,"revenue_shock_std_devs":-1.0,"revenue_elasticity":1.0,"arrears_pct_of_revenue":0.05,"shock_duration_years":2,"near_term_maturity_share":0.2,"refinancing_spread_bps":150,"fuel_subsidy_share":0.0,"tariff_increase_pct":0.0,"fuel_shock_path":[],"legacy_loss_assets":false},"MC_DEFAULT_SIMULATIONS":1000,"MC_DEFAULT_FUEL_STD":0.1,"MC_DEFAULT_FX_STD":0.08,"MC_DEFAULT_CORRELATION":0.3,"MC_HORIZON_YEARS":3,"DEFAULT_GDP_GROWTH":0.03,"REQUIRED_COLUMNS":["Entity","Year","Sector","Revenues","Total Expense","Operating Expense","Operating Profits (EBIT)","Net Income","Current Assets","Total Assets","Current Liabilities","Total Liabilities","Equity","Retained Earnings","Interest Expense","Tax Expense","EBITDA","Government Grants","Depreciation","Currency","Units"],"OPTIONAL_SHOCK_COLUMNS":["Cash and Equivalents","FX Revenue Share","FX Cost Share","FX Debt Share","Floating Rate Debt Share","Short Term Debt","Government Arrears Owed","Fuel Cost Share","VAT Credits"],"GLOSSARY":{"Z-EM score":"A single number summarizing an SOE's financial health from its balance sheet — the higher, the healthier. Built from four ratios (X1–X4) below.","X1":"Working capital ÷ total assets. Measures short-term liquidity — can the SOE cover bills due soon with cash and near-cash assets?","X2":"Retained earnings ÷ total assets. A running total of profit (or loss) kept in the business over its life — negative means accumulated losses.","X3":"EBIT ÷ total assets. How much operating profit the SOE generates from what it owns, before interest and tax.","X4":"Equity ÷ total liabilities. How much of the SOE is financed by its own capital versus borrowed money — negative equity means liabilities exceed what the SOE owns.","Zone":"Safe, Grey, or Distress — a plain-language read of the Z-EM score. Safe > 2.6, Grey 1.1–2.6, Distress ≤ 1.1.","Rating":"An indicative credit-rating letter grade (AAA…D) mapped from the Z-EM score, for reference only — not an actual credit rating from a rating agency.","PD":"Probability of Distress — the estimated chance the SOE ends up in financial distress within a year, taken from the one-year PD of its Z-EM rating band (AAA…D).","EAD":"Exposure at Default — how much money the government could be on the hook for if the SOE defaults. Currently approximated by Total Liabilities.","LGD":"Loss Given Default — of the exposure (EAD), what share the government would actually lose, after any recovery (asset sales, restructuring). You set this — 100% means nothing is recovered.","EFC":"Expected Fiscal Cost = PD × EAD × LGD. The average fiscal cost to government you'd expect if this scenario played out many times.","Fuel shock":"How much more expensive fuel becomes, as a percentage. 25% means fuel prices rise by a quarter.","Tariff pass-through":"How much of a fuel-price rise the SOE is allowed to charge back to customers. 0% means the SOE absorbs the whole shock itself; 100% means customers pay all of it and the SOE's costs are unaffected.","FX shock":"How much the local currency weakens against a hard currency like the US dollar. 15% means it now takes 15% more local currency to buy the same US$1.","Interest rate shock":"How much borrowing costs rise, in basis points (100 bps = 1 percentage point). Only affects the share of debt at a floating (adjustable) interest rate.","GDP/demand shock":"How much the wider economy contracts or grows, which affects how much customers buy from the SOE.","Revenue shock":"A shock to the SOE's revenue, sized in standard deviations of its own historical revenue volatility (or a sector default) rather than a flat percentage — the standard debt-sustainability-analysis convention.","Refinancing shock":"The extra interest cost of rolling over debt that's coming due soon, at a stressed spread — distinct from a floating-rate shock, which reprices debt already on a variable rate.","Government arrears":"Money the government owes the SOE (e.g. for services already delivered) but hasn't yet paid — this can squeeze the SOE's cash even if its accounting profit looks fine.","Monte Carlo simulation":"Instead of one shock scenario, the tool runs thousands of random shock combinations to show a range of possible outcomes, not just one guess.","Fiscal-at-risk":"The 95th-percentile Expected Fiscal Cost across all simulations — a 'bad but plausible' scenario, not the worst case and not the average.","Tariff increase":"An end-user tariff increase decided as a policy response to the shock, as a percentage of revenue. 0% is a tariff freeze (Option A); 10–15% is a partial adjustment (Option B). It reduces what the State and the SOE have to cover.","State compensation":"What the State owes the SOE for keeping tariffs below cost — for SENELEC, the gap between the regulator's Maximum Authorized Revenue (RMA) and tariff revenue. It is booked as revenue when due, but only the part actually paid arrives as cash.","State compensation receivable":"Compensation the State has recognised but not yet paid. It sits in current assets, so profit looks fine, but it is not cash — the SOE has to borrow to pay its fuel bills in the meantime.","Cash funding gap":"Cash the SOE is short of in a year because of losses, unpaid State compensation or input VAT it cannot recover. It is borrowed — short-term (overdrafts, short-term loans, late payment of suppliers) or long-term — and the new debt carries interest.","Cash waterfall":"A priority-of-payments rule: the SOE's cash is paid out in a set order — for example taxes and the operator fee, then independent power producers (IPPs) and fuel, debt service and a reserve, the SOE's minimum operations and maintenance, and finally other suppliers. The order differs by country. It decides who is paid, not how much cash there is: when cash runs short, the lowest ranks go unpaid, so paying IPPs first can leave the SOE's own operations underfunded. Closing the gap takes tariffs or State payments.","Underfunded operations":"Under the cash waterfall, the part of the year's cash shortfall left on the SOE's own costs — its O&M floor and its other operating costs — after the ranks above are paid.","Cost-recovery ratio":"Average tariff divided by the full cost of supply (here operating expense, including depreciation, plus interest). Below 100%, the tariff gap has to be covered by State compensation or absorbed by the SOE.","Shortfall rule":"Under the cash waterfall, who bears the part of the bills the cash cannot pay: the SOE's own operations, junior creditors (other suppliers, regulators, capex), both pro rata, or the State through a budget transfer.","Logistic PD":"A probability of default that keeps rising as the Z-EM score falls, along an S-shaped curve PD = 1 / (1 + e^−(a + b·Z)), instead of stopping at the 40% of the lowest rating band.","Refinancing":"Replacing short-term bank debt (overdrafts) with long-term loans. It moves debt out of current liabilities and can lower the interest rate, but it is a separate assumption: it depends on lenders agreeing, not on the payment order.","Emergency support":"A capital injection from the government once the SOE cannot borrow any more (here: when total liabilities would pass a set share of total assets). It is a direct cost to the budget, on top of the expected fiscal cost.","RMA coverage":"Customer revenue (revenue less government grants, plus any tariff increase or pass-through) as a share of the regulator's Maximum Authorized Revenue (RMA) after the fuel-cost change. The rest has to come from the State.","Adjusted current ratio":"Current assets minus State compensation receivables and trapped VAT credits, divided by current liabilities. Shows liquidity once paper claims are left out; the reported current ratio can even rise when a receivable is funded with short-term debt."},"RATING_SCALE_ASC":["D","CCC-","CCC","CCC+","B-","B","B+","BB-","BB","BB+","BBB-","BBB","BBB+","A-","A","A+","AA-","AA","AA+","AAA"],"SOVEREIGN_OUTLOOK_OPTIONS":["Stable","Positive","Negative"],"ROLE_LEVELS":["Critical","Very Important","Important","Limited Importance"],"ROLE_SCORE":{"Critical":4,"Very Important":3,"Important":2,"Limited Importance":1},"ROLE_CRITERIA":{"Critical":"The SOE operates essentially on behalf of the government — providing a key public service the government would have to provide itself if the SOE didn't exist — or is among the most important SOEs in the country/sector.","Very Important":"Default would have a major impact: either a not-for-profit entity central to a key policy objective, or a profit-seeking SOE whose distress would significantly disrupt the local economy.","Important":"Default would have an important but manageable impact — the SOE provides essential infrastructure or services, or its distress would meaningfully affect one sector of the economy.","Limited Importance":"Default would have a limited impact — one of many similar SOEs, easily substituted, or the government cares more about jobs/operations than its credit standing."},"LINK_LEVELS":["Integral","Very Strong","Strong","Limited"],"LINK_SCORE":{"Integral":4,"Very Strong":3,"Strong":2,"Limited":1},"LINK_CRITERIA":{"Integral":"Essentially an arm of, or very tightly controlled by, the government — a legal framework provides for explicit support, and there's a track record of considerable, timely credit support in all circumstances.","Very Strong":"A very strong, durable link — the government is a strong stable shareholder driving strategy, and has a track record of very strong, timely credit support in most circumstances.","Strong":"The government is an important (often controlling) shareholder with a policy or track record of support in certain circumstances, but governance is more independent, privatization may be contemplated, or a legal framework partly constrains intervention.","Limited":"The government is a minority or non-shareholder with little interference, has very limited capacity or willingness to support on a timely basis, or a track record of adverse intervention."},"LIKELIHOOD_TIERS_ASC":["Low","Moderate","Moderately High","High","Very High","Extremely High","Almost Certain"],"LIKELIHOOD_UPLIFT":{"Almost Certain":{"max_notches":null,"min_gap_to_sovereign":0},"Extremely High":{"max_notches":6,"min_gap_to_sovereign":1},"Very High":{"max_notches":5,"min_gap_to_sovereign":2},"High":{"max_notches":4,"min_gap_to_sovereign":3},"Moderately High":{"max_notches":3,"min_gap_to_sovereign":4},"Moderate":{"max_notches":2,"min_gap_to_sovereign":5},"Low":{"max_notches":0,"min_gap_to_sovereign":null}},"DYNAMIC_CAP_TRIGGER_NOTCHES":3,"DYNAMIC_CAP_TIER":"Moderate","TRIGGER_RULES":[{"id":"distress","level":"alert","short":"Distress zone","category":"Overall health","condition":"Distress score (Z″) ≤ 1.1 (distress zone)","action":"Activate the intervention protocol · require a restructuring plan · budget the expected fiscal cost explicitly for next year","steps":["Within a month: the oversight unit informs the Ministry of Finance and the SOE board meets on the findings","Within three months: the SOE submits a financial recovery plan with measurable targets (costs, collections, tariffs, debt)","Budget the SOE's expected fiscal cost explicitly and disclose it in the fiscal risk statement","Quarterly reporting to the oversight unit until the SOE leaves the distress zone"]},{"id":"neg_equity","level":"alert","short":"Negat
